<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Arclight Dev Dashboard</title>
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" href="/favicons/favicon.ico?v=1" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 16px;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      thead th {
        position: sticky;
        top: 0;
        background: #fafafa;
        z-index: 1;
      }
      th:nth-child(1) {
        width: 60px;
        text-align: right;
      }
      th:nth-child(10) {
        width: 120px;
        text-align: right;
      }
      td:nth-child(1),
      td:nth-child(10) {
        text-align: right;
      }
      .status {
        font-size: 0.9rem;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button id="refreshBtn" type="button" data-i18n="devDashboard.refresh">
        Refresh data
      </button>
      <span id="status" class="status" data-i18n="devDashboard.loaded"
        >Loaded 0 rows</span
      >
    </div>

    <table id="users">
      <thead>
        <tr>
          <th data-i18n="devDashboard.num">No.</th>
          <th data-i18n="devDashboard.name">Name</th>
          <th data-i18n="devDashboard.aims">Aims</th>
          <th data-i18n="devDashboard.interest">Interest</th>
          <th data-i18n="devDashboard.experience">Experience</th>
          <th data-i18n="devDashboard.contact">Contact</th>
          <th data-i18n="devDashboard.country">Country</th>
          <th data-i18n="devDashboard.area">Area</th>
          <th data-i18n="devDashboard.language">Language</th>
          <th data-i18n="devDashboard.refreshCount">Refresh count</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <script type="module" src="/js/dev_dashboard.js"></script>
  </body>
</html>
