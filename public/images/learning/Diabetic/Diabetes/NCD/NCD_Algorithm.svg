<svg width="1200" height="2650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: bold 28px sans-serif; fill: #1a5490; }
      .subtitle { font: 16px sans-serif; fill: #333; }
      .step-box { fill: #e8f4f8; stroke: #1a5490; stroke-width: 2; }
      .step-text { font: bold 16px sans-serif; fill: #1a5490; }
      .detail-text { font: 13px sans-serif; fill: #333; }
      .decision-box { fill: #fff5e6; stroke: #ff8c00; stroke-width: 2; }
      .decision-text { font: bold 14px sans-serif; fill: #ff8c00; }
      .action-box { fill: #ffe6e6; stroke: #c41e3a; stroke-width: 2; }
      .action-text { font: bold 14px sans-serif; fill: #c41e3a; }
      .success-box { fill: #e6f7e6; stroke: #2d8659; stroke-width: 2; }
      .success-text { font: bold 14px sans-serif; fill: #2d8659; }
      .arrow { stroke: #1a5490; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-urgent { stroke: #c41e3a; stroke-width: 3; fill: none; marker-end: url(#arrowhead-urgent); }
      .small-text { font: 11px sans-serif; fill: #666; }
      .phase-title { font: bold 20px sans-serif; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1a5490" />
    </marker>
    <marker id="arrowhead-urgent" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#c41e3a" />
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ff8c00" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="40" class="title" text-anchor="middle">Arclight DR Pragmatic Screening Algorithm</text>
  <text x="600" y="65" class="subtitle" text-anchor="middle">Integrated Eye Screening for NCD Clinics</text>

  <!-- ============ PHASE A: REGISTRATION ============ -->
  <rect x="30" y="90" width="1140" height="580" fill="#e8f4f8" fill-opacity="0.25" stroke="#1a5490" stroke-width="3" rx="10"/>
  <text x="600" y="120" class="phase-title" text-anchor="middle" fill="#1a5490">PHASE A: REGISTRATION</text>

  <!-- Step 1: History -->
  <rect x="450" y="145" width="300" height="70" class="step-box" rx="5"/>
  <text x="600" y="170" class="step-text" text-anchor="middle">1. HISTORY</text>
  <text x="600" y="190" class="detail-text" text-anchor="middle">• Duration of diabetes</text>
  <text x="600" y="207" class="detail-text" text-anchor="middle">• Vision loss? Red/painful eye?</text>
  
  <path d="M 600 215 L 600 230" class="arrow"/>
  
  <!-- Decision: Red painful eye with vision loss? -->
  <polygon points="600,230 690,265 600,300 510,265" class="decision-box"/>
  <text x="600" y="257" class="decision-text" text-anchor="middle">Red painful</text>
  <text x="600" y="274" class="decision-text" text-anchor="middle">eye + vision</text>
  <text x="600" y="291" class="decision-text" text-anchor="middle">loss?</text>
  
  <!-- Yes - REFER -->
  <path d="M 690 265 L 880 265" class="arrow-urgent"/>
  <rect x="880" y="240" width="180" height="50" class="action-box" rx="5"/>
  <text x="970" y="273" class="action-text" text-anchor="middle">REFER</text>
  
  <!-- No - Continue -->
  <path d="M 600 300 L 600 330" class="arrow"/>

  <!-- Step 2: Distance VA -->
  <rect x="450" y="330" width="300" height="85" class="step-box" rx="5"/>
  <text x="600" y="355" class="step-text" text-anchor="middle">2. DISTANCE VISUAL ACUITY</text>
  <text x="600" y="375" class="detail-text" text-anchor="middle">Test each eye separately</text>
  <text x="600" y="392" class="detail-text" text-anchor="middle">Always test with pinhole</text>
  
  <!-- Decision: VA Reduced? -->
  <path d="M 600 415 L 600 435" class="arrow"/>
  <polygon points="600,435 680,470 600,505 520,470" class="decision-box"/>
  <text x="600" y="465" class="decision-text" text-anchor="middle">VA Reduced</text>
  <text x="600" y="482" class="decision-text" text-anchor="middle">+ Pinhole?</text>
  
  <!-- No improvement - REFER (red) -->
  <path d="M 680 470 L 880 470" class="arrow-urgent"/>
  <rect x="880" y="445" width="180" height="50" class="action-box" rx="5"/>
  <text x="970" y="465" class="action-text" text-anchor="middle">REFER</text>
  <text x="970" y="483" class="small-text" text-anchor="middle">(No pinhole improvement)</text>
  
  <!-- Improves with pinhole - Give Glasses (green) -->
  <path d="M 520 470 L 350 470" class="arrow"/>
  <rect x="200" y="445" width="150" height="50" class="success-box" rx="5"/>
  <text x="275" y="478" class="success-text" text-anchor="middle">Give Glasses</text>
  
  <!-- No reduction - Continue -->
  <path d="M 600 505 L 600 535" class="arrow"/>

  <!-- Step 3: Near Vision -->
  <rect x="450" y="535" width="300" height="70" class="step-box" rx="5"/>
  <text x="600" y="560" class="step-text" text-anchor="middle">3. NEAR VISION</text>
  <text x="600" y="580" class="detail-text" text-anchor="middle">Check reading vision</text>
  <text x="600" y="597" class="detail-text" text-anchor="middle">If poor → give near glasses</text>
  
  <path d="M 600 605 L 600 625" class="arrow"/>
  
  <!-- Decision: Near vision poor? -->
  <polygon points="600,625 680,655 600,685 520,655" class="decision-box"/>
  <text x="600" y="650" class="decision-text" text-anchor="middle">Near vision</text>
  <text x="600" y="667" class="decision-text" text-anchor="middle">poor?</text>
  
  <!-- Yes - Give near glasses (green) -->
  <path d="M 680 655 L 880 655" class="arrow"/>
  <rect x="880" y="630" width="180" height="50" class="success-box" rx="5"/>
  <text x="970" y="663" class="success-text" text-anchor="middle">Give near glasses</text>
  
  <!-- No - Continue to Phase B -->
  <path d="M 600 685 L 600 720" class="arrow"/>

  <!-- ============ PHASE B: PRE-DILATION EXAM ============ -->
  <rect x="30" y="720" width="1140" height="440" fill="#fff5e6" fill-opacity="0.25" stroke="#ff8c00" stroke-width="3" rx="10"/>
  <text x="600" y="750" class="phase-title" text-anchor="middle" fill="#ff8c00">PHASE B: PRE-DILATION EXAM</text>

  <!-- Step 4: Pupils -->
  <rect x="450" y="775" width="300" height="85" class="step-box" rx="5"/>
  <text x="600" y="800" class="step-text" text-anchor="middle">4. DIRECT PUPIL RESPONSE</text>
  <text x="600" y="820" class="detail-text" text-anchor="middle">Bright light response</text>
  <text x="600" y="837" class="detail-text" text-anchor="middle">Check: slow, absent, asymmetry</text>
  
  <!-- Decision: Pupils Poor/RAPD? -->
  <path d="M 600 860 L 600 880" class="arrow"/>
  <polygon points="600,880 680,915 600,950 520,915" class="decision-box"/>
  <text x="600" y="910" class="decision-text" text-anchor="middle">Slow, absent,</text>
  <text x="600" y="927" class="decision-text" text-anchor="middle">asymmetry?</text>
  
  <!-- Yes - Refer (disease) -->
  <path d="M 680 915 L 880 915" class="arrow-urgent"/>
  <rect x="880" y="890" width="180" height="50" class="action-box" rx="5"/>
  <text x="970" y="923" class="action-text" text-anchor="middle">REFER (disease)</text>
  
  <!-- No - Continue -->
  <path d="M 600 950 L 600 980" class="arrow"/>

  <!-- Step 5: Front of Eye -->
  <rect x="450" y="980" width="300" height="85" class="step-box" rx="5"/>
  <text x="600" y="1005" class="step-text" text-anchor="middle">5. FRONT OF EYE (Loupe)</text>
  <text x="600" y="1025" class="detail-text" text-anchor="middle">Look for iris new vessels (rubeosis)</text>
  <text x="600" y="1042" class="detail-text" text-anchor="middle">Check for cataract, corneal disease</text>
  
  <!-- Decision: Iris NV? -->
  <path d="M 600 1065 L 600 1085" class="arrow"/>
  <polygon points="600,1085 690,1120 600,1155 510,1120" class="decision-box"/>
  <text x="600" y="1112" class="decision-text" text-anchor="middle">Iris NV or</text>
  <text x="600" y="1129" class="decision-text" text-anchor="middle">treatable</text>
  <text x="600" y="1146" class="decision-text" text-anchor="middle">disease?</text>
  
  <!-- Yes - Urgent Refer -->
  <path d="M 690 1120 L 880 1120" class="arrow-urgent"/>
  <rect x="880" y="1095" width="180" height="50" class="action-box" rx="5"/>
  <text x="970" y="1115" class="action-text" text-anchor="middle">URGENT REFER</text>
  <text x="970" y="1133" class="small-text" text-anchor="middle">(Rubeosis = PDR)</text>
  
  <!-- No - Continue to Phase C -->
  <path d="M 600 1155 L 600 1200" class="arrow"/>

  <!-- ============ PHASE C: POST-DILATION EXAM ============ -->
  <rect x="30" y="1200" width="1140" height="600" fill="#e6f7e6" fill-opacity="0.25" stroke="#2d8659" stroke-width="3" rx="10"/>
  <text x="600" y="1230" class="phase-title" text-anchor="middle" fill="#2d8659">PHASE C: POST-DILATION EXAM</text>

  <!-- Step 6: Dilate -->
  <rect x="450" y="1255" width="300" height="50" class="step-box" rx="5"/>
  <text x="600" y="1287" class="step-text" text-anchor="middle">6. DILATE PUPILS</text>
  
  <path d="M 600 1305 L 600 1325" class="arrow"/>

  <!-- Step 7: Medical Review (parallel) -->
  <rect x="150" y="1255" width="250" height="70" class="step-box" rx="5" stroke-dasharray="5,5"/>
  <text x="275" y="1280" class="step-text" text-anchor="middle">7. MEDICAL REVIEW</text>
  <text x="275" y="1300" class="detail-text" text-anchor="middle">Diabetes / BP / Weight</text>
  <text x="275" y="1317" class="small-text" text-anchor="middle">(Runs in parallel)</text>

  <!-- Step 8: Fundal Reflex -->
  <rect x="450" y="1325" width="300" height="75" class="step-box" rx="5"/>
  <text x="600" y="1350" class="step-text" text-anchor="middle">8. FUNDAL REFLEX TEST</text>
  <text x="600" y="1370" class="detail-text" text-anchor="middle">Check fundal reflex</text>
  
  <!-- Decision: Fundal Reflex Reduced? -->
  <path d="M 600 1400 L 600 1420" class="arrow"/>
  <polygon points="600,1420 680,1455 600,1490 520,1455" class="decision-box"/>
  <text x="600" y="1450" class="decision-text" text-anchor="middle">Reduced /</text>
  <text x="600" y="1467" class="decision-text" text-anchor="middle">Absent?</text>
  
  <!-- Yes - Refer -->
  <path d="M 680 1455 L 880 1455" class="arrow-urgent"/>
  <rect x="880" y="1430" width="180" height="50" class="action-box" rx="5"/>
  <text x="970" y="1450" class="action-text" text-anchor="middle">REFER</text>
  <text x="970" y="1468" class="small-text" text-anchor="middle">(Cataract/VH/Corneal scar)</text>
  
  <!-- No - Continue -->
  <path d="M 600 1490 L 600 1520" class="arrow"/>

  <!-- Step 9: Fundoscopy -->
  <rect x="400" y="1520" width="400" height="60" class="step-box" rx="5"/>
  <text x="600" y="1545" class="step-text" text-anchor="middle">9. FUNDOSCOPY - Look for danger signs</text>
  <text x="600" y="1567" class="detail-text" text-anchor="middle">Examine optic disc, vessels, macula, periphery</text>
  
  <!-- Arrow goes into the big overarching box -->
  <path d="M 600 1580 L 600 1620" class="arrow"/>

  <!-- Large overarching box for ALL THREE conditions -->
  <rect x="60" y="1620" width="1080" height="240" fill="#f0f0f0" stroke="#666" stroke-width="3" rx="5" stroke-dasharray="5,5"/>
  <text x="600" y="1650" class="step-text" text-anchor="middle" font-size="17">FUNDOSCOPY FINDINGS REQUIRING REFERRAL</text>

  <!-- Inner box for DR signs -->
  <rect x="80" y="1670" width="760" height="150" fill="#fafafa" stroke="#999" stroke-width="2" rx="5" stroke-dasharray="3,3"/>
  <text x="460" y="1695" class="step-text" text-anchor="middle" font-size="15">DIABETIC RETINOPATHY SIGNS</text>

  <!-- 1. Proliferative Retinopathy -->
  <rect x="100" y="1710" width="340" height="95" class="action-box" rx="5"/>
  <text x="270" y="1732" class="action-text" text-anchor="middle">1. PROLIFERATIVE</text>
  <text x="270" y="1748" class="action-text" text-anchor="middle">RETINOPATHY</text>
  <text x="270" y="1768" class="detail-text" text-anchor="middle">• NVD / NVE (new vessels)</text>
  <text x="270" y="1783" class="detail-text" text-anchor="middle">• Vitreous haemorrhage</text>
  <text x="270" y="1798" class="detail-text" text-anchor="middle">• Pre-retinal haemorrhage / TRD</text>

  <!-- 2. Severe NPDR - Orange -->
  <rect x="480" y="1710" width="340" height="95" fill="#fff5e6" stroke="#ff8c00" stroke-width="2" rx="5"/>
  <text x="650" y="1732" class="decision-text" text-anchor="middle">2. SEVERE NPDR</text>
  <text x="650" y="1750" class="detail-text" text-anchor="middle">4-2-1 Rule:</text>
  <text x="650" y="1768" class="detail-text" text-anchor="middle">• 4 quadrants haemorrhage/MA</text>
  <text x="650" y="1783" class="detail-text" text-anchor="middle">• 2 quadrants venous beading</text>
  <text x="650" y="1798" class="detail-text" text-anchor="middle">• 1 quadrant IRMA / CWS</text>

  <!-- 3. Maculopathy - separate but in same large box -->
  <rect x="880" y="1670" width="240" height="150" class="action-box" rx="5"/>
  <text x="1000" y="1695" class="action-text" text-anchor="middle">3. MACULOPATHY</text>
  <text x="1000" y="1718" class="detail-text" text-anchor="middle">Hard exudate</text>
  <text x="1000" y="1735" class="detail-text" text-anchor="middle">at/near macula</text>
  <text x="1000" y="1755" class="detail-text" text-anchor="middle">+ Reduced VA</text>
  <text x="1000" y="1772" class="detail-text" text-anchor="middle">+ No pinhole</text>
  <text x="1000" y="1789" class="detail-text" text-anchor="middle">improvement</text>
  <text x="1000" y="1810" class="action-text" text-anchor="middle" font-size="13">→ REFER</text>

  <!-- Arrow exits from bottom of big box straight down to Step 10 -->
  <path d="M 600 1860 L 600 1880" class="arrow"/>

  <!-- Step 10: Final Decision -->
  <rect x="400" y="1880" width="400" height="60" class="step-box" rx="5"/>
  <text x="600" y="1905" class="step-text" text-anchor="middle">10. FINAL DECISION</text>
  <text x="600" y="1927" class="detail-text" text-anchor="middle">Review all findings and determine action</text>

  <!-- Three outcomes -->
  <path d="M 450 1940 L 250 2000" class="arrow"/>
  <rect x="100" y="2000" width="300" height="80" class="success-box" rx="5"/>
  <text x="250" y="2025" class="success-text" text-anchor="middle">REASSURE + EDUCATE</text>
  <text x="250" y="2045" class="detail-text" text-anchor="middle">No sight-threatening disease</text>
  <text x="250" y="2062" class="detail-text" text-anchor="middle">Routine follow-up in NCD clinic</text>
  <text x="250" y="2075" class="small-text" text-anchor="middle">(Annual or as per protocol)</text>

  <path d="M 600 1940 L 600 2000" class="arrow"/>
  <rect x="450" y="2000" width="300" height="80" class="success-box" rx="5"/>
  <text x="600" y="2025" class="success-text" text-anchor="middle">GLASSES / NEAR READERS</text>
  <text x="600" y="2045" class="detail-text" text-anchor="middle">Refractive error or presbyopia</text>
  <text x="600" y="2062" class="detail-text" text-anchor="middle">Provide locally + routine follow-up</text>

  <path d="M 750 1940 L 950 2000" class="arrow-urgent"/>
  <rect x="800" y="2000" width="300" height="80" class="action-box" rx="5"/>
  <text x="950" y="2025" class="action-text" text-anchor="middle">REFER TO EYE SERVICES</text>
  <text x="950" y="2045" class="detail-text" text-anchor="middle">Sight-threatening disease</text>
  <text x="950" y="2062" class="detail-text" text-anchor="middle">Media opacity / Unexplained vision loss</text>
  <text x="950" y="2075" class="small-text" text-anchor="middle">(See referral criteria below)</text>

  <!-- Summary Box: Always Refer If -->
  <rect x="50" y="2140" width="1100" height="180" fill="#fff0f0" stroke="#c41e3a" stroke-width="3" rx="5"/>
  <text x="600" y="2170" class="action-text" text-anchor="middle" font-size="18">ALWAYS REFER IF:</text>
  
  <text x="100" y="2205" class="detail-text">✓ Proliferative signs (NVD, NVE, VH, pre-ret bleed, TRD)</text>
  <text x="100" y="2230" class="detail-text">✓ Severe NPDR (4-2-1 rule, cotton wool spots)</text>
  <text x="100" y="2255" class="detail-text">✓ Maculopathy with reduced VA</text>
  <text x="100" y="2280" class="detail-text">✓ Abnormal pupils (poor response, RAPD)</text>
  
  <text x="650" y="2205" class="detail-text">✓ Lost or reduced fundal reflex</text>
  <text x="650" y="2230" class="detail-text">✓ Iris neovascularization (rubeosis)</text>
  <text x="650" y="2255" class="detail-text">✓ Unexplained poor vision (not improving with pinhole)</text>
  <text x="650" y="2280" class="detail-text">✓ Suspected glaucoma (cupped disc, poor pupil)</text>

  <!-- Key Principles -->
  <rect x="50" y="2360" width="1100" height="140" fill="#e6f7ff" stroke="#1a5490" stroke-width="2" rx="5"/>
  <text x="600" y="2390" class="step-text" text-anchor="middle" font-size="18">KEY PRINCIPLES</text>
  
  <text x="100" y="2425" class="detail-text">• Look for ALL causes of sight loss, not just diabetic retinopathy</text>
  <text x="100" y="2447" class="detail-text">• Pragmatic, not perfect - focus on clear danger signs</text>
  <text x="100" y="2469" class="detail-text">• Integrate into routine NCD clinic workflow</text>
  <text x="100" y="2491" class="detail-text">• Simple, safe, and scalable for low-resource settings</text>

  <!-- Footer -->
  <text x="600" y="2560" class="small-text" text-anchor="middle">Tools needed: Visual acuity chart, pinhole, near vision chart, bright light/torch,</text>
  <text x="600" y="2580" class="small-text" text-anchor="middle">loupe (or phone magnifier), dilating drops, direct ophthalmoscope (Arclight recommended)</text>
  
  <text x="600" y="2615" class="detail-text" text-anchor="middle" fill="#1a5490">For nurses, OCOs, optometrists, and clinical officers in NCD clinics</text>

</svg>
