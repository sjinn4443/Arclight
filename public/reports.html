<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title data-i18n="auto.reports.arclight_reports">Arclight Reports</title>
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" href="/favicons/favicon.ico?v=1" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 16px;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      thead th {
        position: sticky;
        top: 0;
        background: #fafafa;
        z-index: 1;
      }
      .status {
        font-size: 0.9rem;
        opacity: 0.8;
      }
      .reports-separator {
        margin: 24px 0;
        opacity: 0.25;
      }
      .reports-section-title {
        margin: 0 0 8px;
      }
      .reports-map-status {
        font-size: 12px;
        opacity: 0.7;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button id="refreshBtn" type="button" data-i18n="i18nExtra.restart">
        Restart
      </button>
      <span id="status" class="status">0</span>
    </div>

    <table id="users">
      <thead>
        <tr>
          <th data-col="no" data-i18n="i18nExtra.no">No.</th>
          <th data-col="name" data-i18n="onboarding.username_label">Name</th>
          <th
            data-col="professional_group"
            data-i18n="i18nExtra.reports_professional_group"
          >
            Professional Group
          </th>
          <th data-col="interest" data-i18n="myprofile.interest">Interest</th>
          <th data-col="experience" data-i18n="onboarding.experience_label">
            Experience
          </th>
          <th data-col="arclight" data-i18n="i18nExtra.reports_arclight">
            Arclight
          </th>
          <th data-col="contact" data-i18n="auto.reports.contact">Contact</th>
          <th data-col="country" data-i18n="auto.reports.country">Country</th>
          <th data-col="language" data-i18n="menu.language_item">Language</th>
          <th data-col="refresh_count" data-i18n="i18nLiteral.records">
            records
          </th>
          <th data-col="when" data-i18n="i18nLiteral.when">when</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <hr class="reports-separator" />
    <h3
      class="reports-section-title"
      data-i18n="i18nExtra.about_location_data_title"
    >
      About location data
    </h3>
    <div id="worldMap"></div>
    <p
      id="mapStatus"
      class="reports-map-status"
      data-i18n="i18nExtra.loading_map"
    >
      Loading map...
    </p>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="/js/safe-console-init.js"></script>
    <script type="module" src="/js/reports.js"></script>
  </body>
</html>
