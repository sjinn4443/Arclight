<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Arclight Reports</title>
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" href="/favicons/favicon.ico?v=1" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 16px;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      thead th {
        position: sticky;
        top: 0;
        background: #fafafa;
        z-index: 1;
      }
      .status {
        font-size: 0.9rem;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button id="refreshBtn" type="button">Refresh data</button>
      <span id="status" class="status">Loaded 0 rows</span>
    </div>

    <table id="users">
      <thead>
        <tr>
          <th>No.</th>
          <th>Name</th>
          <th>Professional Group</th>
          <th>Interest</th>
          <th>Experience</th>
          <th>Arclight</th>
          <th>Contact</th>
          <th>Country</th>
          <th>Language</th>
          <th>Refresh count</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <script type="module" src="/js/reports.js"></script>
  </body>
</html>
