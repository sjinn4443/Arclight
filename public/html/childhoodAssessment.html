<!-- public/html/childhoodAssessment.html -->
<div id="childhoodAssessmentQuizPage" class="page has-eyes-topbar">
  <div class="container pupils-container">
    <div class="eyes-topbar">
      <div
        class="eyes-topbar__title"
        data-i18n="auto.childhoodassessment.assessment"
      >
        Assessment
      </div>
      <div class="eyes-topbar__icons">
        <span
          class="icon menuBtn"
          aria-label="Menu"
          data-i18n="i18nExtra.menu_aria_label:aria-label"
          >☰</span
        >
      </div>
    </div>
  </div>

  <template id="childhoodAssessmentLayoutTemplate">
    <div class="quiz-container">
      <div class="quiz-scroll">
        <form id="childhoodQuizForm"></form>
      </div>

      <div class="quiz-footer">
        <button
          type="submit"
          form="childhoodQuizForm"
          class="start-btn"
          data-i18n="i18nExtra.see_results"
        >
          See Results
        </button>
      </div>

      <div id="childhoodQuizModal" class="quiz-modal hidden">
        <div class="quiz-modal-content">
          <p id="childhoodQuizScoreText"></p>
          <button id="childhoodSeeWhyBtn" data-i18n="i18nLiteral.Check Answer">
            Check Answer
          </button>
        </div>
      </div>
    </div>
  </template>

  <template id="childhoodAssessmentBlockTemplate">
    <div class="quiz-block">
      <div class="quiz-question-heading">
        <span class="quiz-question-badge" aria-hidden="true"></span>
        <p class="quiz-question"></p>
      </div>
      <img class="quiz-image" src="" alt="" loading="lazy" />
      <div class="quiz-options"></div>
      <p
        class="answer"
        style="display: none; margin-top: 5px; font-style: italic"
      ></p>
    </div>
  </template>

  <template id="childhoodAssessmentOptionTemplate">
    <label class="radio-label">
      <input type="radio" />
      <span class="quiz-option-text"></span>
    </label>
  </template>
</div>
