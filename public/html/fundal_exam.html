<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="i18nExtra.fundal_exam_title">Fundal Exam</title>

    <script src="/vendor/lottie.min.js"></script>

    <style>
      body {
        margin: 0;
        background: black;
        color: white;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        text-align: center;
      }

      #lottie-container {
        width: 90vw;
        max-width: 800px;
        margin: 0 auto;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
        overflow: hidden;
      }

      #status {
        margin: 1rem 0 2rem;
        color: #ccc;
        font-size: 0.9rem;
      }

      .lottie-svg {
        width: 100%;
        height: auto;
      }
    </style>
  </head>

  <body>
    <div id="lottie-container"></div>
    <div id="status" data-i18n="i18nExtra.fundal_exam_loading">
      Loading Fundal_Exam.json...
    </div>

    <script>
      const container = document.getElementById("lottie-container");
      const statusEl = document.getElementById("status");

      const LANG_ALIAS = {
        en: "english",
        am: "amharic",
        ar: "arabic",
        bn: "bangla",
        ny: "chichewa",
        zh: "chinese",
        fr: "french",
        ha: "hausa",
        hi: "hindi",
        ne: "nepali",
        ig: "igbo",
        id: "indonesian",
        rw: "kinyarwanda",
        ko: "korean",
        te: "telugu",
        ln: "lingala",
        fa: "persian",
        pt: "portuguese",
        sn: "shona",
        es: "spanish",
        sw: "swahili",
        ur: "urdu",
        yo: "yoruba",
        zu: "zulu",
      };

      function getPathValue(obj, path) {
        return String(path || "")
          .split(".")
          .reduce(
            (acc, key) => (acc && key in acc ? acc[key] : undefined),
            obj,
          );
      }

      function interpolate(template, vars = {}) {
        return String(template).replace(
          /\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g,
          (_, key) => String(vars[key] ?? ""),
        );
      }

      function getPreferredLanguage() {
        const fromStorage = localStorage.getItem("prefLang");
        if (fromStorage) return fromStorage;
        const htmlLang = (
          document.documentElement.getAttribute("lang") || ""
        ).trim();
        return htmlLang || "en";
      }

      const dictionaryPromise = (async () => {
        const lang = getPreferredLanguage();
        const alias = LANG_ALIAS[lang] || LANG_ALIAS.en;
        try {
          const res = await fetch(`/translation/${alias}.json`, {
            cache: "no-store",
          });
          if (!res.ok) return {};
          return await res.json();
        } catch {
          return {};
        }
      })();

      async function translate(path, fallback, vars = {}) {
        const dict = await dictionaryPromise;
        const translated = getPathValue(dict, path);
        return interpolate(translated == null ? fallback : translated, vars);
      }

      function setStatus(path, fallback, vars = {}) {
        void translate(path, fallback, vars).then((text) => {
          statusEl.textContent = text;
        });
      }

      const SEGMENTS = [
        [0, 201],
        [201, 272],
        [272, 451],
        [451, 526],
        [526, 771],
        [771, 852],
        [852, 1020],
        [1020, 1403],
        [1403, 1676],

        [1676, 2011],
        [2011, 2122],

        [2122, 2245],
        [2245, 2458],
        [2458, 2584],
        [2584, 2793],
        [2793, 2973],
        [2973, 3296],
        [3296, 3693],
        [3693, 3868],
        [3868, 4084],
        [4084, 4174],
        [4174, 4461],

        [4461, 4573],
        [4573, 4669],
        [4669, 4925],

        [4925, 5237],
        [5237, 5467],
        [5467, 5716],
        [5716, 5943],
        [5943, 6321],
      ];

      let currentSegment = 0;
      let isPlaying = false;
      let isThrottled = false;
      const ua = navigator.userAgent || "";
      const isIOSRenderer =
        /iPad|iPhone|iPod/.test(ua) ||
        (navigator.platform === "MacIntel" &&
          Number(navigator.maxTouchPoints || 0) > 1);

      const anim = lottie.loadAnimation({
        container: container,
        renderer: isIOSRenderer ? "canvas" : "svg",
        loop: false,
        autoplay: false,
        path: "Fundal_prep.json",
      });

      anim.addEventListener("DOMLoaded", () => {
        const svg = container.querySelector("svg");
        if (svg) svg.classList.add("lottie-svg");

        setStatus(
          "i18nExtra.fundal_exam_loaded_scroll",
          "Loaded. Scroll to move through sections.",
        );
        playSegment(0);
      });

      function playSegment(index) {
        if (index < 0 || index >= SEGMENTS.length) return;

        const [start, end] = SEGMENTS[index];
        isPlaying = true;
        currentSegment = index;

        setStatus(
          "i18nExtra.fundal_exam_playing_section",
          "Playing section {{current}} of {{total}}...",
          { current: index + 1, total: SEGMENTS.length },
        );

        anim.playSegments([start, end], true);
      }

      anim.addEventListener("complete", () => {
        isPlaying = false;
        setStatus(
          "i18nExtra.fundal_exam_section_complete",
          "Section {{current}} complete. Scroll up/down for the next section.",
          { current: currentSegment + 1 },
        );
      });

      anim.addEventListener("data_failed", () => {
        setStatus(
          "i18nExtra.fundal_exam_load_failed",
          "Could not load Fundal_Exam.json. Check file name or location.",
        );
        console.error("Lottie: failed to load Fundal_Exam.json");
      });

      window.addEventListener(
        "wheel",
        (event) => {
          event.preventDefault();

          if (isThrottled || isPlaying) return;

          if (event.deltaY > 0) {
            if (currentSegment < SEGMENTS.length - 1) {
              playSegment(currentSegment + 1);
            } else {
              setStatus(
                "i18nExtra.fundal_exam_final_section",
                "You're at the final section.",
              );
            }
          } else if (event.deltaY < 0) {
            if (currentSegment > 0) {
              playSegment(currentSegment - 1);
            } else {
              setStatus(
                "i18nExtra.fundal_exam_first_section",
                "You're at the first section.",
              );
            }
          }

          isThrottled = true;
          setTimeout(() => {
            isThrottled = false;
          }, 300);
        },
        { passive: false },
      );
    </script>
  </body>
</html>
