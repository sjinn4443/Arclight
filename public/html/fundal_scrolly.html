<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fundal Reflex Scrollytelling</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000;
        color: #fff;
        height: 100vh;
        overflow: hidden; /* 실제 스크롤은 막고, wheel만 사용 */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      h1 {
        position: absolute;
        top: 10px;
        font-size: 16px;
        opacity: 0.8;
      }
      #lottie-container {
        width: 100%;
        max-width: 900px;
        aspect-ratio: 16 / 9;
      }
      #status {
        position: absolute;
        bottom: 16px;
        font-size: 13px;
        opacity: 0.75;
      }
    </style>

    <!-- Lottie CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  </head>
  <body>
    <h1>Fundal Reflex – Scroll Sections</h1>
    <div id="lottie-container"></div>
    <div id="status">Loading Fundal_Reflex_ae.json…</div>

    <script>
      const statusEl = document.getElementById("status");

      // ① Lottie 애니메이션 로드
      const anim = lottie.loadAnimation({
        container: document.getElementById("lottie-container"),
        renderer: "svg",
        loop: false, // 전체 루프 X
        autoplay: false, // 자동 재생 X (우리가 세그먼트 단위로 컨트롤)
        path: "Fundal_Reflex_ae.json", // 같은 폴더에 있는 JSON
      });

      // ② 섹션(프레임 구간) 정의
      //    네가 말한 경계: 170, 365, 596, 끝
      //    → 실제 프레임 구간 4개로 나눔
      const SEGMENTS = [
        [0, 170], // 섹션 1: 처음 자동 재생
        [170, 365], // 섹션 2: 첫 스크롤
        [365, 596], // 섹션 3: 두 번째 스크롤
        [596, 900], // 섹션 4: 세 번째 스크롤 (끝까지)
      ];

      let currentSegment = 0; // 지금 몇 번째 섹션인지
      let isPlaying = false; // 섹션 재생 중인지
      let isThrottled = false; // 휠 이벤트 쿨타임 (script.js 패턴 재사용 느낌)

      // 섹션 하나 재생 함수
      function playSegment(index) {
        if (index < 0 || index >= SEGMENTS.length) return;

        const [start, end] = SEGMENTS[index];
        currentSegment = index;
        isPlaying = true;
        statusEl.textContent = `Section ${index + 1}: frames ${start} → ${end}`;

        // 항상 정방향 재생 (스크롤 위로 올려도 "해당 섹션"을 다시 앞으로 재생)
        anim.setDirection(1);
        anim.playSegments([start, end], true);
      }

      // Lottie 데이터 로딩 완료 시: 첫 섹션 자동 재생
      anim.addEventListener("DOMLoaded", () => {
        statusEl.textContent = "Section 1 auto-playing (0 → 170)…";
        playSegment(0);
      });

      // 세그먼트 재생 끝나면 멈춤
      anim.addEventListener("complete", () => {
        isPlaying = false;
        const [start, end] = SEGMENTS[currentSegment];
        statusEl.textContent = `Section ${currentSegment + 1} finished (stopped at frame ${end}). Scroll for next section.`;
      });

      // ③ 마우스 휠로 섹션 이동
      window.addEventListener(
        "wheel",
        (e) => {
          // 실제 페이지 스크롤 막기
          e.preventDefault();

          // 재생 중이거나, 휠 너무 약하거나, 쿨타임이면 무시
          if (isPlaying || isThrottled || Math.abs(e.deltaY) < 5) return;

          const isScrollDown = e.deltaY > 0;

          if (isScrollDown) {
            // 아래로 스크롤 → 다음 섹션
            if (currentSegment < SEGMENTS.length - 1) {
              playSegment(currentSegment + 1);
            } else {
              statusEl.textContent = "마지막 섹션까지 재생 완료!";
            }
          } else {
            // 위로 스크롤 → 이전 섹션 다시 보기 (역재생 X, 그냥 그 섹션 다시 앞으로 재생)
            if (currentSegment > 0) {
              playSegment(currentSegment - 1);
            } else {
              statusEl.textContent = "처음 섹션입니다.";
            }
          }

          // 네가 쓰던 script.js처럼 300ms 쿨타임 비슷하게 넣어줌
          isThrottled = true;
          setTimeout(() => {
            isThrottled = false;
          }, 300);
        },
        { passive: false },
      );
    </script>
  </body>
</html>
