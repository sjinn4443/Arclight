<!-- Onboarding Page — Guides new users through account creation, collecting their name, field of work, job role, and experience level to personalize their app experience. -->
<div id="onboarding" class="page">
  <div class="container onboarding-container">
    <div
      class="onb-title-row"
      style="display: flex; align-items: center; gap: 8px"
    >
      <h1 class="onb-title" data-i18n="onboarding.title" style="margin: 0">
        Create Account
      </h1>

      <button
        type="button"
        id="onboardingInfoBtn"
        class="lang-install__info-icon account__info-icon"
        aria-label="More information about creating an account"
      >
        <svg
          class="info-icon__svg"
          viewBox="0 0 24 24"
          aria-hidden="true"
          focusable="false"
        >
          <circle
            cx="12"
            cy="12"
            r="10"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />
          <line
            x1="12"
            y1="10"
            x2="12"
            y2="16"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
          <circle cx="12" cy="7" r="1.2" fill="currentColor" />
        </svg>
      </button>
    </div>

    <div class="form-field">
      <label for="username" data-i18n="onboarding.username_label">Name</label>
      <input
        type="text"
        id="username"
        class="onb-input"
        placeholder="Enter"
        data-i18n="onboarding.username_placeholder:placeholder"
        autocomplete="name"
      />
      <!-- speech bubble -->
      <div
        id="usernameTooltip"
        class="tooltip hidden"
        data-i18n="onboarding.username_tooltip"
      >
        Name must be at least 2 letters, no numbers or special characters
      </div>
    </div>

    <div class="form-field">
      <label for="interestSelectDisplay" data-i18n="onboarding.field_label"
        >Interest(s)</label
      >

      <!-- hidden real select (data source + 저장용) -->
      <select
        id="interestSelect"
        name="interest"
        class="onb-input"
        multiple
        aria-required="true"
        style="display: none"
      >
        <option
          value=""
          disabled
          hidden
          data-i18n="onboarding.field_placeholder:placeholder"
        >
          Select
        </option>
        <option value="eyes" data-i18n="onboarding.field_eyes">Eyes</option>
        <option value="ears" data-i18n="onboarding.field_ears">Ears</option>
        <option value="skin" data-i18n="onboarding.field_skin">Skin</option>
        <option value="generalist" data-i18n="onboarding.field_generalist">
          Generalist
        </option>
      </select>

      <!-- dropdown UI (보이는 부분) -->
      <div class="onb-select-wrap multi-select" id="interestSelectUi">
        <button
          type="button"
          id="interestSelectDisplay"
          class="onb-input multi-select__btn"
          aria-haspopup="listbox"
          aria-expanded="false"
        >
          <span id="interestSelectText" class="multi-select__text">Select</span>
          <span class="onb-select-caret" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M7 10l5 5 5-5z" fill="currentColor"></path>
            </svg>
          </span>
        </button>

        <div
          id="interestSelectPanel"
          class="multi-select__panel hidden"
          role="listbox"
        ></div>
      </div>

      <div id="interestError" class="tooltip hidden" style="margin-top: 6px">
        Please select at least one interest
      </div>
    </div>

    <div class="form-field" id="jobField">
      <label for="jobSelectDisplay" data-i18n="onboarding.job_label">
        Role(s)
      </label>

      <!-- ✅ hidden real select (data source + 저장용) -->
      <select
        id="jobSelect"
        name="jobRole"
        class="onb-input"
        multiple
        aria-required="true"
        style="display: none"
      >
        <option
          value=""
          disabled
          hidden
          data-i18n="onboarding.job_role_placeholder"
        >
          Select
        </option>

        <!-- Eyes -->
        <optgroup
          label="Eyes"
          data-i18n="onboarding.job_group_eyes:label"
          data-field="eyes"
        >
          <option
            value="ophthalmologist"
            data-i18n="onboarding.job_ophthalmologist"
          >
            Ophthalmologist
          </option>
          <option value="optometrist" data-i18n="onboarding.job_optometrist">
            Optometrist
          </option>
          <option
            value="ophthalmic_clinical_officer"
            data-i18n="onboarding.job_ophthalmic_clinical_officer"
          >
            Ophthalmic Clinical Officer
          </option>
          <option
            value="ophthalmic_nurse"
            data-i18n="onboarding.job_ophthalmic_nurse"
          >
            Ophthalmic Nurse
          </option>
          <option value="orthoptist" data-i18n="onboarding.job_orthoptist">
            Orthoptist
          </option>
          <option
            value="general_practitioner"
            data-i18n="onboarding.job_general_practitioner"
          >
            General Practitioner
          </option>
          <option
            value="clinical_officer"
            data-i18n="onboarding.job_clinical_officer"
          >
            Clinical Officer
          </option>
          <option
            value="primary_health_care_nurse"
            data-i18n="onboarding.job_primary_health_care_nurse"
          >
            Primary Health Care Nurse
          </option>
          <option
            value="community_health_worker"
            data-i18n="onboarding.job_community_health_worker"
          >
            Community Health Worker
          </option>
          <option
            value="village_health_worker"
            data-i18n="onboarding.job_village_health_worker"
          >
            Village Health Worker
          </option>
          <option
            value="lady_community_health_worker"
            data-i18n="onboarding.job_lady_community_health_worker"
          >
            Lady Community Health Worker
          </option>
          <option
            value="health_extension_worker"
            data-i18n="onboarding.job_health_extension_worker"
          >
            Health Extension Worker
          </option>
          <option
            value="medical_student"
            data-i18n="onboarding.job_medical_student"
          >
            Medical Student
          </option>
          <option
            value="eye_care_practitioner_other"
            data-i18n="onboarding.job_eye_care_practitioner_other"
          >
            Eye Care Practitioner - Other
          </option>

          <!-- ✅ Teaching roles (추가) -->
          <option value="ophthalmology_lecturer">Ophthalmology Lecturer</option>
          <option value="optometry_lecturer">Optometry Lecturer</option>
          <option value="eye_care_clinical_educator">
            Eye Care Clinical Educator
          </option>
          <option value="consultant_teaching_role">
            Consultant (Teaching role)
          </option>
          <option value="programme_trainer_eye_health">
            NGO / Programme Trainer (Eye Health)
          </option>
          <option value="school_teacher_vision_programmes">
            School Teacher (Vision programmes)
          </option>
        </optgroup>

        <!-- Ears -->
        <optgroup
          label="Ears"
          data-i18n="onboarding.job_group_ears:label"
          data-field="ears"
        >
          <option
            value="ent_specialist"
            data-i18n="onboarding.job_ent_specialist"
          >
            ENT Specialist
          </option>
          <option value="audiologist" data-i18n="onboarding.job_audiologist">
            Audiologist
          </option>
          <option
            value="ear_care_practitioner"
            data-i18n="onboarding.job_ear_care_practitioner"
          >
            Ear Care Practitioner
          </option>
          <option
            value="general_practitioner"
            data-i18n="onboarding.job_general_practitioner"
          >
            General Practitioner
          </option>
          <option
            value="clinical_officer"
            data-i18n="onboarding.job_clinical_officer"
          >
            Clinical Officer
          </option>
          <option
            value="primary_health_care_nurse"
            data-i18n="onboarding.job_primary_health_care_nurse"
          >
            Primary Health Care Nurse
          </option>
          <option
            value="community_health_worker"
            data-i18n="onboarding.job_community_health_worker"
          >
            Community Health Worker
          </option>
          <option
            value="village_health_worker"
            data-i18n="onboarding.job_village_health_worker"
          >
            Village Health Worker
          </option>
          <option
            value="lady_community_health_worker"
            data-i18n="onboarding.job_lady_community_health_worker"
          >
            Lady Community Health Worker
          </option>
          <option
            value="health_extension_worker"
            data-i18n="onboarding.job_health_extension_worker"
          >
            Health Extension Worker
          </option>
          <option
            value="medical_student"
            data-i18n="onboarding.job_medical_student"
          >
            Medical Student
          </option>
        </optgroup>

        <!-- Skin -->
        <optgroup
          label="Skin"
          data-i18n="onboarding.job_group_skin:label"
          data-field="skin"
        >
          <option
            value="dermatologist"
            data-i18n="onboarding.job_dermatologist"
          >
            Dermatologist
          </option>
          <option
            value="general_practitioner"
            data-i18n="onboarding.job_general_practitioner"
          >
            General Practitioner
          </option>
          <option
            value="clinical_officer"
            data-i18n="onboarding.job_clinical_officer"
          >
            Clinical Officer
          </option>
          <option
            value="primary_health_care_nurse"
            data-i18n="onboarding.job_primary_health_care_nurse"
          >
            Primary Health Care Nurse
          </option>
          <option
            value="community_health_worker"
            data-i18n="onboarding.job_community_health_worker"
          >
            Community Health Worker
          </option>
          <option
            value="village_health_worker"
            data-i18n="onboarding.job_village_health_worker"
          >
            Village Health Worker
          </option>
          <option
            value="lady_community_health_worker"
            data-i18n="onboarding.job_lady_community_health_worker"
          >
            Lady Community Health Worker
          </option>
          <option
            value="health_extension_worker"
            data-i18n="onboarding.job_health_extension_worker"
          >
            Health Extension Worker
          </option>
          <option
            value="medical_student"
            data-i18n="onboarding.job_medical_student"
          >
            Medical Student
          </option>
        </optgroup>
      </select>

      <!-- ✅ dropdown UI (보이는 부분) -->
      <div class="onb-select-wrap multi-select" id="jobSelectUi">
        <button
          type="button"
          id="jobSelectDisplay"
          class="onb-input multi-select__btn"
          aria-haspopup="listbox"
          aria-expanded="false"
        >
          <span id="jobSelectText" class="multi-select__text">Select</span>
          <span class="onb-select-caret" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M7 10l5 5 5-5z" fill="currentColor"></path>
            </svg>
          </span>
        </button>

        <div
          id="jobSelectPanel"
          class="multi-select__panel hidden"
          role="listbox"
        ></div>
      </div>

      <div id="roleError" class="tooltip hidden" style="margin-top: 6px">
        Please select at least one role
      </div>
    </div>

    <!-- ✅ Medical Student를 선택했을 때만 표시 -->
    <div class="form-field hidden" id="studentYearField">
      <label for="studentYearSelect" data-i18n="onboarding.experience_label"
        >Experience</label
      >
      <div class="onb-select-wrap">
        <select id="studentYearSelect" class="onb-input">
          <option
            value=""
            disabled
            selected
            hidden
            data-i18n="onboarding.experience_placeholder:placeholder"
          >
            Select
          </option>
          <option value="lt1" data-i18n="onboarding.experience_lt1">
            Pre-clinical
          </option>
          <option value="1" data-i18n="onboarding.experience_1">
            Early clinical
          </option>
          <option value="2" data-i18n="onboarding.experience_2">
            Final year / Senior medical student
          </option>
          <option value="3" data-i18n="onboarding.experience_3">
            Shadowing
          </option>
          <option value="4" data-i18n="onboarding.experience_4">
            Supervised participation
          </option>
          <option value="5" data-i18n="onboarding.experience_5">
            Electives / Clerkships
          </option>
          <option value="6" data-i18n="onboarding.experience_6">
            Simulation training
          </option>
          <option value="7" data-i18n="onboarding.experience_7">Others</option>
        </select>
        <span class="onb-select-caret" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M7 10l5 5 5-5z" fill="currentColor"></path>
          </svg>
        </span>
      </div>
    </div>

    <!-- ✅ Medical Student 외 직업을 하나라도 선택하면 표시 -->
    <div class="form-field hidden" id="practiceLevelField">
      <label data-i18n="onboarding.practiceLevelLabel">Experience</label>
      <div id="experienceByRole">
        <!-- ✅ KEEP (but disabled for now): old manual inputs -->
        <!--
      <div class="exp-manual-inputs">
        <input id="expYears" type="number" min="0" placeholder="Years" />
        <input id="expMonths" type="number" min="0" max="11" placeholder="Months" />
      </div>
    -->
      </div>
    </div>

    <button
      id="completeOnboardingBtn"
      class="onb-cta"
      data-i18n="onboarding.continue_button"
      disabled
    >
      Next Step
    </button>

    <button
      id="skipContinueBtn"
      class="primary-btn"
      data-i18n="onboarding.skip_button"
    >
      Continue as Guest
    </button>
  </div>
</div>

<template id="practiceLevelTemplate">
  <div class="role-exp-block">
    <div class="role-exp-label"></div>
    <div class="role-exp-row">
      <div class="onb-select-wrap">
        <select class="onb-input" data-kind="practiceLevel">
          <option value="" disabled hidden>Years of experience</option>
          <option value="0-2">0-2</option>
          <option value="2-5">2-5</option>
          <option value="5-10">5-10</option>
          <option value="10+">10+</option>
        </select>
        <span class="onb-select-caret" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M7 10l5 5 5-5z" fill="currentColor"></path>
          </svg>
        </span>
      </div>
    </div>
  </div>
</template>

<template id="privacyTermsModalTemplate">
  <div class="guest-modal">
    <button class="guest-modal__close" aria-label="Close">&times;</button>
    <h2 class="guest-modal__title">Privacy &amp; Terms</h2>

    <div class="guest-modal__text privacyterms__text">
      <p><strong>Information we collect</strong></p>
      <p>We collect a small amount of personal data:</p>
      <ul>
        <li>name</li>
        <li>email address</li>
        <li>learning goals</li>
        <li>IP address or an approximate location based on it</li>
      </ul>
      <p>
        Only information needed to run and improve the service is collected.
      </p>

      <p><strong>How we use it</strong></p>
      <p>
        This data helps to tailor the app to each person&#39;s goals, understand
        how the app is used and improve features over time. It may also be used
        to get in touch about important changes to the app or an account.<br />
        Personal data is never sold.
      </p>

      <p><strong>Where it is stored</strong></p>
      <p>
        Information is stored on a managed server and database provided by
        Railway. Railway provides the hosting and infrastructure; we control how
        data is used within the app and keep it only for as long as reasonably
        needed.
      </p>

      <p><strong>Third-party services</strong></p>
      <p>
        We rely on trusted third-party services, such as hosting providers, to
        run the app. These services only process data as needed to provide the
        infrastructure and do not have permission to use it for their own
        purposes.
      </p>

      <p><strong>Seeing or deleting data</strong></p>
      <p>
        Anyone can ask to see, update or delete the information held about
        them.<br />
        Please email: __
      </p>
      <p>
        Identity may need to be confirmed before a request is completed. If any
        information must be kept for legal or security reasons, this will be
        explained.
      </p>

      <p><strong>Your account</strong></p>
      <p>
        If you create an account, please keep your login details secure.<br />
        You are responsible for activity on your account unless you let us know
        about misuse or a security problem.
      </p>

      <p><strong>Education only</strong></p>
      <p>
        This app is an education tool to support learning and revision. It is
        not formal academic, legal or professional advice and cannot guarantee
        exam passes, grades or any particular outcome. Study choices and
        decisions remain the user&#39;s responsibility.
      </p>

      <p><strong>Responsibility and limits</strong></p>
      <p>
        The aim is to keep the app helpful and reliable, but no service is
        perfect. Continuous availability or complete freedom from errors cannot
        be promised, and the app may not suit every situation.
      </p>
      <p>
        As far as UK law allows, we are not responsible for losses such as
        missed marks, lost income or opportunities that arise from using, or
        being unable to use, the app. Nothing here removes any rights provided
        by UK law.
      </p>

      <p>Using the app means accepting these Privacy &amp; Terms.</p>
    </div>
  </div>
</template>
