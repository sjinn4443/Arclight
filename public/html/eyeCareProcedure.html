<link rel="stylesheet" href="/style/eye-care-procedure.css" />
<div
  id="eyeCareProcedurePage"
  class="page has-eyes-topbar eye-care-procedure-page"
>
  <div class="container pupils-container">
    <div class="eyes-topbar">
      <div class="eyes-topbar__title" data-i18n="eyesCatalogTitle">Eyes</div>
      <div class="eyes-topbar__icons">
        <span
          class="icon menuBtn"
          role="button"
          tabindex="0"
          aria-label="Menu"
          data-i18n="pecWorkshop.menu:aria-label"
          >&#9776;</span
        >
      </div>
    </div>
    <section class="eye-care-procedure-box pupil-level pupil-level--primary">
      <h1 class="eye-care-procedure-cap pupil-level__cap"></h1>
      <div class="eye-care-procedure-lessons"></div>
    </section>
  </div>
</div>

<template id="eyeCareProcedureVideoTemplate">
  <div
    class="page has-eyes-topbar full-animation-video-page eye-care-procedure-video-page"
    style="display: none"
  >
    <div class="container pupils-container">
      <div class="eyes-topbar">
        <div class="eyes-topbar__title eye-care-procedure-video-category"></div>
        <div class="eyes-topbar__icons">
          <div class="tri-toggle" role="radiogroup" aria-label="Video quality">
            <button
              class="tri-toggle__btn"
              type="button"
              role="radio"
              aria-checked="true"
              data-mode="low"
              data-i18n="i18nExtra.video_mode_low"
            >
              low
            </button>
            <button
              class="tri-toggle__btn"
              type="button"
              role="radio"
              aria-checked="false"
              data-mode="high"
              data-i18n="i18nExtra.video_mode_high"
            >
              high
            </button>
            <div class="tri-toggle__knob" aria-hidden="true"></div>
          </div>
          <span
            class="icon menuBtn"
            role="button"
            tabindex="0"
            aria-label="Menu"
            data-i18n="pecWorkshop.menu:aria-label"
            >&#9776;</span
          >
        </div>
      </div>
      <main class="pec-procedure-video-content">
        <div class="video-header">
          <h3 class="pec-procedure-video-title"></h3>
        </div>
        <div class="video-container">
          <video
            class="pec-procedure-video"
            controls
            playsinline
            preload="metadata"
          >
            <source src="" type="video/mp4" />
            <span data-i18n="videos.videoNotSupported"
              >Your browser does not support the video tag.</span
            >
          </video>
        </div>
      </main>
    </div>
  </div>
</template>

<template id="eyePadShieldScrollTemplate">
  <div
    id="makeEyePadShieldScrollPage"
    class="page pupils-like has-eyes-topbar childhood-fundal-scroll-page"
    style="display: none"
  >
    <div class="container pupils-container">
      <div class="eyes-topbar">
        <div class="eyes-topbar__title" data-i18n="pecWorkshop.make_eye_pad">
          Make an eye pad and eye shield
        </div>
        <div class="eyes-topbar__icons">
          <div
            class="fundal-scroll-narration-controls"
            data-fundal-scroll-narration-controls
          >
            <select
              class="fundal-scroll-narration-controls__language"
              data-fundal-scroll-narration-language
              aria-label="Narration language"
            ></select>
            <button
              type="button"
              class="fundal-scroll-narration-controls__toggle"
              data-fundal-scroll-narration-toggle
              aria-label="Turn narration off"
              aria-pressed="true"
            >
              🔊
            </button>
          </div>
          <span
            class="icon menuBtn"
            role="button"
            tabindex="0"
            aria-label="Menu"
            data-i18n="pecWorkshop.menu:aria-label"
            >&#9776;</span
          >
        </div>
      </div>
      <h2 class="pupils-subtitle"></h2>
      <div
        class="childhood-fundal-prep-list"
        aria-label="Make an eye pad and eye shield guide"
      ></div>
    </div>
  </div>
</template>

<!-- Eye Pad / Shield Full Animation Video Page -->
<div
  id="makeEyePadShieldFullAnimationVideoPage"
  class="page full-animation-video-page"
  style="display: none"
>
  <div>
    <div
      class="tri-toggle"
      role="radiogroup"
      aria-label="Video mode"
      data-i18n="i18nExtra.video_mode:aria-label"
    >
      <button
        class="tri-toggle__btn"
        type="button"
        role="radio"
        aria-checked="false"
        data-mode="low"
        data-i18n="i18nExtra.video_mode_low"
      >
        low
      </button>
      <button
        class="tri-toggle__btn"
        type="button"
        role="radio"
        aria-checked="false"
        data-mode="high"
        data-i18n="i18nExtra.video_mode_high"
      >
        high
      </button>
      <div class="tri-toggle__knob" aria-hidden="true"></div>
    </div>

    <div class="video-header">
      <h3>Eye Pad / Shield Full Animation</h3>
    </div>

    <div
      class="video-container"
      id="makeEyePadShieldFullAnimationVideoContainer"
    >
      <video
        id="makeEyePadShieldFullAnimationVideo"
        controls
        playsinline
        webkit-playsinline
        preload="none"
      >
        <source src="" type="video/mp4" />
        <span data-i18n="videos.videoNotSupported"
          >Your browser does not support the video tag.</span
        >
      </video>
    </div>

    <button
      class="video-share-btn"
      type="button"
      data-video-share-btn
      aria-label="Share"
      title="Share"
      data-i18n="i18nExtra.share_video:aria-label;i18nExtra.share_video:title"
    >
      <svg
        class="video-share-icon"
        viewBox="0 0 24 24"
        width="18"
        height="24"
        aria-hidden="true"
        focusable="false"
      >
        <path
          d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.02-4.11c.54.5 1.25.81 2.07.81 1.66 0 3-1.34 3-3S19.66 2 18 2s-3 1.34-3 3c0 .24.04.47.09.7L8.07 9.81C7.53 9.31 6.82 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.82 0 1.53-.31 2.07-.81l7.11 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92S19.61 16.08 18 16.08z"
        ></path>
      </svg>
    </button>
  </div>
</div>
