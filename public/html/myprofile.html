<div class="profile-page page active" id="myProfilePage">
  <div class="profile-topbar">
    <div class="profile-topbar__title" data-i18n="myprofile.my_profile">
      My Profile
    </div>
    <div class="profile-topbar__icons">
      <button
        class="icon-btn"
        aria-label="Notifications"
        data-i18n="i18nExtra.notifications:aria-label"
      >
        🔔<span class="notif-dot" aria-hidden="true"></span>
      </button>
      <button
        class="icon-btn menuBtn"
        aria-label="Menu"
        data-i18n="i18nExtra.menu_aria_label:aria-label"
      >
        ☰
      </button>
    </div>
  </div>

  <div class="profile-workspace">
    <header class="profile-overview-heading">
      <h1 data-i18n="myprofile.my_profile">My Profile</h1>
      <p data-i18n="profileLayout.overview_description">
        Your details and learning milestones.
      </p>
    </header>
    <div class="profile-main-grid">
      <section
        class="profile-header profile-card"
        aria-labelledby="profileName"
      >
        <div class="profile-card__cover">
          <div class="profile-card__brand">
            <span>ARCLIGHT</span
            ><span data-i18n="profileLayout.learning_profile"
              >Learning profile</span
            >
          </div>
          <div class="profile-card__identity">
            <div
              class="profile-avatar"
              id="profileAvatar"
              role="img"
              aria-label="Profile photo"
              data-i18n="i18nExtra.profile_photo:aria-label"
            ></div>
            <div class="profile-identity">
              <p class="profile-name" id="profileName" data-i18n-skip>
                Your name
              </p>
              <p
                class="profile-role"
                id="profileRole"
                data-i18n-skip
                hidden
              ></p>
            </div>
            <button
              type="button"
              class="profile-edit-trigger"
              id="profileEditBtn"
              disabled
              aria-label="Edit Profile"
              data-i18n="myprofile.edit_profile:aria-label"
              aria-haspopup="dialog"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="m16 3 5 5-12 12-6 1 1-6L16 3Z M13 6l5 5" />
              </svg>
            </button>
          </div>
        </div>
        <dl class="profile-card__details">
          <div class="profile-card__row">
            <dt data-i18n="onboarding.field_label">Interest(s)</dt>
            <dd id="profileInterests" data-i18n-skip></dd>
          </div>
          <div
            class="profile-card__row"
            id="profileClinicalExperienceRow"
            hidden
          >
            <dt data-i18n="onboarding.experience_label">Experience</dt>
            <dd id="profileClinicalExperience" data-i18n-skip></dd>
          </div>
          <div class="profile-card__row">
            <dt data-i18n="profileLayout.device_use">Arclight use</dt>
            <dd id="profileDeviceUse" data-i18n-skip></dd>
          </div>
          <div class="profile-card__row">
            <dt data-i18n="profileLayout.app_purpose">App use</dt>
            <dd id="profilePurposes" data-i18n-skip></dd>
          </div>
        </dl>
        <p
          class="profile-edit-error"
          id="profileEditError"
          role="alert"
          hidden
        ></p>
      </section>

      <div class="profile-learning-column">
        <section
          class="section profile-achievements-panel"
          aria-labelledby="profileAchievementsTitle"
        >
          <h2
            class="section-title"
            id="profileAchievementsTitle"
            data-i18n="myprofile.achievements"
          >
            Achievements
          </h2>
          <dl class="profile-learning-stats">
            <div>
              <dt data-i18n="profileLayout.modules_completed">
                Modules completed
              </dt>
              <dd id="profileCompletedCount" data-i18n-skip>0</dd>
            </div>
            <div>
              <dt data-i18n="profileLayout.stamps_earned">Stamps earned</dt>
              <dd id="profileStampCount" data-i18n-skip>0</dd>
            </div>
          </dl>
          <div class="achievements-row" id="profileAchievements"></div>
        </section>

        <div class="settings-list">
          <button type="button" class="settings-item" data-route="settings">
            <svg
              class="profile-action-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="m9 3-.6 2.4-1.5.9-2.4-.7-3 5.2 1.8 1.7v1.8l-1.8 1.7 3 5.2 2.4-.7 1.5.9L9 24h6l.6-2.6 1.5-.9 2.4.7 3-5.2-1.8-1.7v-1.8l1.8-1.7-3-5.2-2.4.7-1.5-.9L15 3Z"
                transform="translate(1 0) scale(.9)"
              />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <span data-i18n="auto.myprofile.settings">Settings</span>
            <span class="profile-settings-arrow" aria-hidden="true">›</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
