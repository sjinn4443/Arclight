<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="myprofile.my_profile">My Profile</title>

    <!-- Your existing global styles -->
    <link rel="stylesheet" href="style/base.css" />
    <link rel="stylesheet" href="style/components.css" />
    <link rel="stylesheet" href="style/pages.css" />
    <link rel="stylesheet" href="style/responsive.css" />
  </head>

  <body>
    <div class="profile-page page active" id="myProfilePage">
      <!-- Top bar -->
      <div class="profile-topbar">
        <div class="profile-topbar__title" data-i18n="myprofile.my_profile">
          My Profile
        </div>

        <div class="profile-topbar__icons">
          <!-- Bell -->
          <button
            class="icon-btn"
            aria-label="Notifications"
            data-i18n="i18nExtra.notifications:aria-label"
          >
            🔔
            <span class="notif-dot" aria-hidden="true"></span>
          </button>

          <!-- Menu -->
          <button
            class="icon-btn menuBtn"
            aria-label="Menu"
            data-i18n="i18nExtra.menu_aria_label:aria-label"
          >
            ☰
          </button>
        </div>
      </div>

      <!-- Profile header -->
      <div class="profile-header">
        <div class="profile-avatar-wrap">
          <div
            class="profile-avatar"
            id="profileAvatar"
            aria-label="Profile photo"
            role="img"
          ></div>
          <button
            type="button"
            class="profile-avatar-edit"
            id="profileAvatarEditBtn"
            aria-label="Edit profile photo"
          >
            Edit
          </button>
          <input type="file" id="profileAvatarInput" accept="image/*" hidden />
        </div>

        <div>
          <p class="profile-name" id="profileName" data-i18n-skip>Your name</p>
          <p class="profile-role" id="profileRole" data-i18n-skip>
            Role not set
          </p>
        </div>
      </div>

      <!-- Interest -->
      <div class="section">
        <div class="section-title" data-i18n="myprofile.interest">Interest</div>
        <div class="interest-select">
          <select
            id="interestSelect"
            aria-label="Interest"
            data-i18n="myprofile.interest:aria-label"
            data-profile-interest
          >
            <option selected data-i18n="myprofile.eyes">Eyes</option>
            <option data-i18n="myprofile.ears">Ears</option>
          </select>
        </div>
      </div>

      <!-- Background -->
      <div class="section">
        <div class="section-title" data-i18n="myprofile.background">
          Background
        </div>

        <div class="profile-detail-list">
          <div class="profile-detail-row">
            <div class="profile-detail-label" data-i18n="onboarding.job_label">
              Role(s)
            </div>
            <div class="profile-detail-value" id="profileRoles" data-i18n-skip>
              Not set
            </div>
          </div>

          <div class="profile-detail-row">
            <div
              class="profile-detail-label"
              data-i18n="onboarding.experience_label"
            >
              Experience
            </div>
            <div
              class="profile-detail-value"
              id="profileExperience"
              data-i18n-skip
            >
              Not set
            </div>
          </div>
        </div>
      </div>

      <!-- Achievements -->
      <div class="section">
        <div class="section-title" data-i18n="myprofile.achievements">
          Achievements
        </div>
        <div class="achievements-row" id="profileAchievements">
          <div class="achievement-tile"></div>
          <div class="achievement-tile"></div>
          <div class="achievement-tile"></div>
        </div>
      </div>

      <!-- Account -->
      <div class="section">
        <div class="section-title">Account</div>
        <div class="settings-list">
          <div
            class="settings-item"
            data-route="editProfile"
            data-i18n="myprofile.edit_profile"
          >
            Edit Profile
          </div>
          <div class="menu-item" data-route="languageinstall">
            <img
              src="images/icon/base/language_b.webp"
              alt="Language"
              class="menu-item-icon"
              width="24"
              height="24"
              data-i18n="menu.language_item:alt"
            />

            <span data-i18n="menu.language_item">Language</span>
          </div>
          <div class="settings-item" data-route="settings">Settings</div>
        </div>
      </div>
    </div>

    <!-- If your app uses the menu overlay globally -->
    <script src="js/menu.js"></script>
    <script>
      if (window.initializeMenu) window.initializeMenu();
    </script>
  </body>
</html>
