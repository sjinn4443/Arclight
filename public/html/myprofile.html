<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="auto.myprofile.my_profile">My Profile</title>

    <!-- Your existing global styles -->
    <link rel="stylesheet" href="style/base.css" />
    <link rel="stylesheet" href="style/components.css" />
    <link rel="stylesheet" href="style/pages.css" />
    <link rel="stylesheet" href="style/responsive.css" />

    <!-- New page-specific styles -->
    <link rel="stylesheet" href="style/myprofile.css" />
  </head>

  <body>
    <div class="profile-page page active" id="myProfilePage">
      <!-- Top bar -->
      <div class="profile-topbar">
        <div
          class="profile-topbar__title"
          data-i18n="auto.myprofile.my_profile"
        >
          My Profile
        </div>

        <div class="profile-topbar__icons">
          <!-- Bell -->
          <button class="icon-btn" aria-label="Notifications">
            🔔
            <span class="notif-dot" aria-hidden="true"></span>
          </button>

          <!-- Menu -->
          <button class="icon-btn menuBtn" aria-label="Menu">☰</button>
        </div>
      </div>

      <!-- Profile header -->
      <div class="profile-header">
        <div class="profile-avatar" aria-hidden="true"></div>

        <div>
          <p class="profile-name" data-i18n="auto.myprofile.sujin_kang">
            Sujin Kang
          </p>
          <p class="profile-role" data-i18n="auto.myprofile.medical_student">
            Medical Student
          </p>
        </div>
      </div>

      <!-- Interest -->
      <div class="section">
        <div class="section-title" data-i18n="auto.myprofile.interest">
          Interest
        </div>
        <div class="interest-select">
          <select id="interestSelect" aria-label="Interest">
            <option selected data-i18n="auto.myprofile.eyes">Eyes</option>
            <option data-i18n="auto.myprofile.ears">Ears</option>
          </select>
        </div>
      </div>

      <!-- Background -->
      <div class="section">
        <div class="section-title" data-i18n="auto.myprofile.background">
          Background
        </div>

        <div
          class="bg-row"
          data-key="ownsArclight"
          aria-label="I own an Arclight device"
        >
          <div
            class="bg-row__label"
            data-i18n="auto.myprofile.i_own_an_arclight_device"
          >
            I own an Arclight device
          </div>

          <div
            class="bg-chips"
            role="radiogroup"
            aria-label="Owns an Arclight device"
          >
            <button
              type="button"
              class="bg-chip"
              data-value="yes"
              role="radio"
              aria-checked="false"
              data-i18n="i18nExtra.yes"
            >
              Yes
            </button>
            <button
              type="button"
              class="bg-chip"
              data-value="no"
              role="radio"
              aria-checked="false"
              data-i18n="i18nExtra.no"
            >
              No
            </button>
          </div>
        </div>

        <div
          class="bg-row"
          data-key="priorTraining"
          aria-label="I have received prior Arclight training"
        >
          <div
            class="bg-row__label"
            data-i18n="i18nExtra.prior_arclight_training"
          >
            I have received prior Arclight training
          </div>

          <div
            class="bg-chips"
            role="radiogroup"
            aria-label="Prior Arclight training"
          >
            <button
              type="button"
              class="bg-chip"
              data-value="yes"
              role="radio"
              aria-checked="false"
              data-i18n="i18nExtra.yes"
            >
              Yes
            </button>
            <button
              type="button"
              class="bg-chip"
              data-value="no"
              role="radio"
              aria-checked="false"
              data-i18n="i18nExtra.no"
            >
              No
            </button>
          </div>
        </div>
      </div>

      <!-- Achievements -->
      <div class="section">
        <div class="section-title" data-i18n="auto.myprofile.achievements">
          Achievements
        </div>
        <div class="achievements-row">
          <div class="achievement-tile"></div>
          <div class="achievement-tile"></div>
          <div class="achievement-tile"></div>
        </div>
      </div>

      <!-- Settings -->
      <div class="section">
        <div class="section-title" data-i18n="auto.myprofile.settings">
          Settings
        </div>
        <div class="settings-list">
          <div
            class="settings-item"
            data-route="editProfile"
            data-i18n="auto.myprofile.edit_profile"
          >
            Edit Profile
          </div>
          <div class="menu-item" data-route="languageinstall">
            <img
              src="images/icon/base/language_b.webp"
              alt="Language"
              class="menu-item-icon"
              width="24"
              height="24"
            />

            <span data-i18n="menu.language_item">Language</span>
          </div>
        </div>
      </div>
    </div>

    <!-- If your app uses the menu overlay globally -->
    <script src="js/menu.js"></script>
    <script>
      if (window.initializeMenu) window.initializeMenu();
    </script>
  </body>
</html>
