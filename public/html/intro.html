<!-- Intro Page — Introduces users to the Arclight app with a welcome message, feature overview, and options to explore or skip the introduction. -->
<div id="introPage" class="page">
  <div class="container intro-container">
    <!-- Progress bar -->
    <div class="intro-progress">
      <div class="intro-progress__track">
        <div class="intro-progress__fill"></div>
      </div>
    </div>

    <!-- Text -->
    <h1 class="intro-title" data-i18n="intro.title">
      Welcome to<br />the Arclight App!
    </h1>
    <p class="intro-sub" data-i18n="intro.subtitle">
      Here’s a quick overview of the features<br />
      to help you get started
    </p>

    <!-- Center phone image + arrows -->
    <div class="intro-hero-wrapper">
      <button class="intro-arrow intro-arrow-left"><</button>

      <img
        src="images/onboarding/onboarding-240.webp"
        srcset="
          images/onboarding/onboarding-240.webp 240w,
          images/onboarding/onboarding-480.webp 480w,
          images/onboarding/onboarding.webp     740w
        "
        sizes="(max-width: 480px) 120px, 220px"
        class="intro-hero"
        alt="App preview"
        width="359"
        height="740"
        decoding="async"
        data-i18n="intro.app_preview_alt:alt"
      />

      <button class="intro-arrow intro-arrow-right">></button>
    </div>

    <!-- Buttons 
    <button
      id="exploreBtn"
      class="onb-cta intro-primary"
      data-i18n="intro.explore_button"
    >
      Explore the App
    </button>-->
    <button
      id="skipBtn"
      class="btn-outline intro-outline"
      data-i18n="intro.skip_button"
    >
      Go Straight to App
    </button>
  </div>
</div>
