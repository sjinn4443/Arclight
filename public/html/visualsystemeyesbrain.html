<div id="visualsystemeyesbrainPage" class="page pupils-like has-eyes-topbar">
  <div class="container pupils-container">
    <div class="eyes-topbar">
      <div
        class="eyes-topbar__title"
        data-i18n="auto.visualsystemeyesbrain.childhood_eye_screening"
      >
        Childhood Eye Screening
      </div>
      <div class="eyes-topbar__icons">
        <span
          class="icon menuBtn"
          aria-label="Menu"
          data-i18n="i18nExtra.menu_aria_label:aria-label"
          >&#9776;</span
        >
      </div>
    </div>

    <h2
      class="pupils-subtitle"
      data-i18n="auto.visualsystemeyesbrain.eye_brain"
    >
      Eyes & Brain
    </h2>

    <div class="pupils-levels">
      <div class="visualsystem-scroll-wrap">
        <section
          class="vs-story"
          aria-label="Eye and brain scrollytelling"
          data-i18n="auto.childhoodeyebrainimages.eye_brain:aria-label"
        >
          <div class="vs-story__sticky">
            <div class="vs-scene" aria-hidden="true">
              <div class="vs-scroll-cue" data-vs="scrollCue">
                <div class="vs-scroll-cue__pill">
                  <span
                    class="vs-scroll-cue__label"
                    data-i18n="auto.visualimpairment.scroll_down:html"
                    >scroll<br />down</span
                  >
                  <div class="vs-scroll-cue__stack">
                    <img
                      class="vs-scroll-cue__down"
                      src="/scrolly/workshop/childhood/eyesbrain/down.png"
                      alt=""
                      loading="eager"
                    />
                    <img
                      class="vs-scroll-cue__hand"
                      src="/scrolly/workshop/childhood/eyesbrain/hand.png"
                      alt=""
                      loading="eager"
                    />
                    <span class="vs-scroll-cue__chev"></span>
                    <span class="vs-scroll-cue__chev"></span>
                    <span class="vs-scroll-cue__chev"></span>
                  </div>
                </div>
              </div>

              <div class="vs-caption vs-caption--intro" data-vs="introCaption">
                <p
                  class="vs-caption__body"
                  data-i18n="i18nExtra.visualsystem_step0:html"
                >
                  The eyes collect light from the world and turn this into
                  signals for the brain to create ‘vision’
                </p>
              </div>

              <div class="vs-caption vs-caption--world" data-vs="worldCaption">
                <p
                  class="vs-caption__body"
                  data-vs="worldCaptionText"
                  data-i18n="i18nExtra.visualsystem_step1:html"
                >
                  Cornea and lens focus light onto the back of the eye
                </p>
              </div>

              <div class="vs-caption vs-caption--final" data-vs="finalCaption">
                <p
                  class="vs-caption__body"
                  data-vs="finalCaptionText"
                  data-i18n="i18nExtra.visualsystem_step3:html"
                >
                  The retina works like a camera sensor
                </p>
              </div>

              <div class="vs-layer vs-background" data-vs="background">
                <img
                  src="/scrolly/workshop/childhood/eyesbrain/background.png"
                  alt=""
                  loading="eager"
                />
              </div>

              <img
                class="vs-layer vs-cloud vs-cloud--1"
                data-vs="cloud1"
                src="/scrolly/workshop/childhood/eyesbrain/cloud.png"
                alt=""
                loading="eager"
              />
              <img

              <img
