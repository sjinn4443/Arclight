<div
  class="page"
  id="visualsystemeyesbrainPage"
  class="page pupils-like has-eyes-topbar"
>
  <!-- Eyes top bar (casestudy/eyes 계열과 동일한 형태로 맞추기) -->
  <div class="container pupils-container">
    <div class="eyes-topbar">
      <div class="eyes-topbar__title">Childhood Eye Screening</div>
      <div class="eyes-topbar__icons">
        <span class="icon menuBtn" aria-label="Menu">☰</span>
      </div>
    </div>

    <h2 class="pupils-subtitle">Childhood eye screening</h2>

    <div class="pupils-levels">
      <!-- Content -->
      <div class="container visualsystem-scroll-wrap">
        <div
          class="visualsystem-stage"
          role="group"
          aria-label="Visual system scroll"
        >
          <div
            id="vs_lottie"
            class="visualsystem-lottie"
            aria-label="Visual system animation"
          ></div>

          <div class="visualsystem-side" aria-label="Explanation">
            <div id="vs_text" class="visualsystem-text">Loading…</div>
          </div>
        </div>

        <div class="visualsystem-hud">
          <div class="visualsystem-pill" id="vs_status">Loading…</div>
          <div class="visualsystem-pill">
            Wheel: next/prev · ↑/↓: next/prev · Space: replay
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
