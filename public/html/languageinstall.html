<!-- Language Install Page — Allows users to select their preferred language and provides options to install the app for offline use or continue using it online. -->
<div id="languageInstallPage" class="page">
  <div class="lang-install">
    <div class="lang-install__body">
      <label
        class="lang-install__label"
        for="prefLang"
        data-i18n="languageInstall.title"
        >Select Language</label
      >
      <div class="lang-install__select-wrap">
        <select id="prefLang" name="language" class="lang-install__select">
          <option
            value="en"
            data-native="English"
            lang="en"
            selected
            data-i18n-skip="true"
          >
            English
          </option>
          <option value="am" data-native="አማርኛ" lang="am" data-i18n-skip="true">
            አማርኛ
          </option>
          <option
            value="ar"
            data-native="العربية"
            lang="ar"
            data-i18n-skip="true"
          >
            العربية
          </option>
          <option
            value="bn"
            data-native="বাংলা"
            lang="bn"
            data-i18n-skip="true"
          >
            বাংলা
          </option>
          <option value="zh" data-native="中文" lang="zh" data-i18n-skip="true">
            中文
          </option>
          <option
            value="fr"
            data-native="Français"
            lang="fr"
            data-i18n-skip="true"
          >
            Français
          </option>
          <option
            value="ha"
            data-native="Hausa"
            lang="ha"
            data-i18n-skip="true"
          >
            Hausa
          </option>
          <option
            value="hi"
            data-native="हिन्दी"
            lang="hi"
            data-i18n-skip="true"
          >
            हिन्दी
          </option>
          <option
            value="ne"
            data-native="नेपाली"
            lang="ne"
            data-i18n-skip="true"
          >
            नेपाली
          </option>
          <option
            value="ny"
            data-native="Chinyanja"
            lang="ny"
            data-i18n-skip="true"
          >
            Chinyanja
          </option>
          <option value="ig" data-native="Ígbò" lang="ig" data-i18n-skip="true">
            Ígbò
          </option>
          <option
            value="id"
            data-native="Bahasa Indonesia"
            lang="id"
            data-i18n-skip="true"
          >
            Bahasa Indonesia
          </option>
          <option
            value="rw"
            data-native="Ikinyarwanda"
            lang="rw"
            data-i18n-skip="true"
          >
            Ikinyarwanda
          </option>
          <option
            value="ko"
            data-native="한국어"
            lang="ko"
            data-i18n-skip="true"
          >
            한국어
          </option>
          <option value="lo" data-native="ລາວ" lang="lo" data-i18n-skip="true">
            ລາວ
          </option>
          <option
            value="te"
            data-native="తెలుగు"
            lang="te"
            data-i18n-skip="true"
          >
            తెలుగు
          </option>
          <option
            value="lg"
            data-native="Luganda"
            lang="lg"
            data-i18n-skip="true"
          >
            Luganda
          </option>
          <option
            value="ln"
            data-native="Lingála"
            lang="ln"
            data-i18n-skip="true"
          >
            Lingála
          </option>

          <option
            value="fa"
            data-native="فارسی"
            lang="fa"
            data-i18n-skip="true"
          >
            فارسی
          </option>

          <option
            value="pt"
            data-native="Português"
            lang="pt"
            data-i18n-skip="true"
          >
            Português
          </option>

          <option
            value="sn"
            data-native="ChiShona"
            lang="sn"
            data-i18n-skip="true"
          >
            ChiShona
          </option>

          <option
            value="es"
            data-native="Español"
            lang="es"
            data-i18n-skip="true"
          >
            Español
          </option>
          <option
            value="sw"
            data-native="Kiswahili"
            lang="sw"
            data-i18n-skip="true"
          >
            Kiswahili
          </option>
          <option value="ur" data-native="اردو" lang="ur" data-i18n-skip="true">
            اردو
          </option>
          <option
            value="yo"
            data-native="Yorùbá"
            lang="yo"
            data-i18n-skip="true"
          >
            Yorùbá
          </option>
          <option
            value="zu"
            data-native="isiZulu"
            lang="zu"
            data-i18n-skip="true"
          >
            isiZulu
          </option>
        </select>
      </div>

      <button
        id="installAppBtn"
        class="btn-lg-grey"
        data-i18n="languageInstall.install_button"
      >
        Install App
      </button>
      <div class="lang-install__hint-row">
        <div
          class="lang-install__hint"
          data-i18n="languageInstall.install_hint"
        >
          No internet needed after install
        </div>
        <button
          type="button"
          id="offlineInfoBtn"
          class="lang-install__info-icon"
          aria-label="More information about offline access"
          data-i18n="languageInstall.offline_info_aria:aria-label"
        >
          <svg
            class="info-icon__svg"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <circle
              cx="12"
              cy="12"
              r="10"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            />
            <line
              x1="12"
              y1="10"
              x2="12"
              y2="16"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
            <circle cx="12" cy="7" r="1.2" fill="currentColor" />
          </svg>
        </button>
      </div>

      <div class="lang-install__divider">
        <span></span
        ><span data-i18n="languageInstall.divider_or"><!--or--></span
        ><span></span>
      </div>

      <button
        id="useOnlineBtn"
        class="btn-outline-light"
        data-i18n="languageInstall.use_online_button"
      >
        Continue in Browser
      </button>
      <div class="lang-install__hint-row">
        <div
          class="lang-install__hint"
          data-i18n="languageInstall.use_online_hint"
        >
          Requires internet connection
        </div>
        <button
          type="button"
          id="onlineInfoBtn"
          class="lang-install__info-icon"
          aria-label="More information about using the app online"
          data-i18n="languageInstall.online_info_aria:aria-label"
        >
          <svg
            class="info-icon__svg"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
          >
            <circle
              cx="12"
              cy="12"
              r="10"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            />
            <line
              x1="12"
              y1="10"
              x2="12"
              y2="16"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
            <circle cx="12" cy="7" r="1.2" fill="currentColor" />
          </svg>
        </button>
      </div>
    </div>
  </div>
  <!-- Download App Modal -->
  <div
    id="downloadAppModal"
    class="modal-overlay hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="downloadAppTitle"
  >
    <div class="modal-box download-modal">
      <div class="modal-header">
        <span id="downloadAppTitle" data-i18n="languageInstall.downloadAppTitle"
          >Download options</span
        >
        <button
          id="closeDownloadAppModalBtn"
          class="modal-close"
          aria-label="Close"
          data-i18n="languageInstall.closeButton:aria-label"
        >
          ×
        </button>
      </div>

      <div class="modal-content">
        <p data-i18n="languageInstall.downloadAppContent">
          Choose which content to download for offline use.
        </p>
        <p data-i18n="languageInstall.downloadStorageNotice">
          This app requires about 1 GB of storage.
        </p>
      </div>

      <div class="modal-footer btn-row">
        <button
          id="notNowBtn"
          class="btn-outline-light"
          type="button"
          data-i18n="languageInstall.notNowButton"
        >
          Not now
        </button>
        <button
          id="downloadAllBtn"
          class="btn-lg-grey"
          type="button"
          data-i18n="languageInstall.downloadNowButton"
        >
          Download now
        </button>
      </div>
    </div>
  </div>

  <template id="languageInstallHintModalTemplate">
    <div id="hintModalOverlay" role="dialog" aria-modal="true">
      <div class="guest-modal">
        <button
          class="guest-modal__close"
          aria-label="Close"
          data-i18n="languageInstall.closeButton:aria-label"
        >
          &times;
        </button>
        <h2 class="guest-modal__title"></h2>
        <div class="guest-modal__text"></div>
      </div>
    </div>
  </template>

  <template id="languageInstallHelpIos">
    <div class="lang-install__hint-body">
      <span data-i18n="i18nExtra.languageinstall_ios_step1">
        1) Tap the Share button
      </span>
      <svg
        class="lang-install__inline-icon"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          d="M12 3l4 4h-3v6h-2V7H8l4-4zM5 10v9h14v-9h2v9c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2v-9h2z"
        />
      </svg>
      <span data-i18n="i18nExtra.languageinstall_ios_step1_suffix"
        >in the address bar</span
      ><br />
      <span data-i18n="i18nExtra.languageinstall_step2_select">2) Select</span>
      <strong data-i18n="auto.languageinstall.add_to_home_screen"
        >Add to Home Screen</strong
      >
      <br /><br />
      <span data-i18n="i18nExtra.languageinstall_storage_notice">
        This app requires about 1 GB of storage.
      </span>
    </div>
  </template>

  <template id="languageInstallHelpAndroid">
    <div class="lang-install__hint-body">
      <strong data-i18n="auto.languageinstall.on_android">On Android:</strong
      ><br /><br />
      <span data-i18n="i18nExtra.languageinstall_android_step1"
        >1) Tap the browser menu</span
      >
      <strong>(&#x22EE;)</strong><br />
      <span data-i18n="i18nExtra.languageinstall_step2_select">2) Select</span>
      <strong data-i18n="auto.languageinstall.install_app">Install app</strong>
      <span data-i18n="i18nExtra.languageinstall_or">or</span>
      <strong data-i18n="auto.languageinstall.add_to_home_screen"
        >Add to Home Screen</strong
      >
      <br /><br />
      <span data-i18n="i18nExtra.languageinstall_storage_notice">
        This app requires about 1 GB of storage.
      </span>
    </div>
  </template>

  <template id="languageInstallHelpDefault">
    <div class="lang-install__hint-body">
      <span data-i18n="i18nExtra.languageinstall_default_choose"
        >आफ्नो ब्राउजरको मेनु प्रयोग गरी</span
      >
      <strong data-i18n="auto.languageinstall.install_app">Install app</strong>
      <span data-i18n="i18nExtra.languageinstall_or">or</span>
      <strong data-i18n="auto.languageinstall.add_to_home_screen"
        >Add to Home Screen</strong
      >. <br /><br />
      <span data-i18n="i18nExtra.languageinstall_storage_notice">
        This app requires about 1 GB of storage.
      </span>
    </div>
  </template>

  <template id="languageInstallHintOffline">
    <div
      class="lang-install__hint-body"
      data-i18n="i18nExtra.languageinstall_hint_offline:html"
    >
      Install the app to use without<br />
      Wi-Fi / mobile data.<br /><br />
      Some content (e.g. videos),<br />may need to be downloaded first.
    </div>
  </template>

  <template id="languageInstallHintOnline">
    <div
      class="lang-install__hint-body"
      data-i18n="i18nExtra.languageinstall_hint_online:html"
    >
      Use the app in your current browser. <br />An internet connection is
      required.
    </div>
  </template>
</div>
