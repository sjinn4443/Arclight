<div class="profile-page settings-page page active" id="settingsPage">
  <div class="profile-topbar">
    <div class="profile-topbar__title" data-i18n="auto.settings.settings">
      Settings
    </div>

    <div class="profile-topbar__icons">
      <button
        class="icon-btn menuBtn"
        aria-label="Menu"
        data-i18n="i18nExtra.menu_aria_label:aria-label"
      >
        &#9776;
      </button>
    </div>
  </div>

  <div class="settings-page__content">
    <section class="settings-section" aria-labelledby="settingsPreferences">
      <h2
        class="settings-section-title"
        id="settingsPreferences"
        data-i18n="profileLayout.preferences"
      >
        Preferences
      </h2>

      <button
        type="button"
        class="settings-row settings-row--link"
        id="openLanguageModal"
        data-route="languageinstall"
        data-guest-free="true"
      >
        <span data-i18n="auto.settings.language">Language</span>
        <span class="settings-row__value">
          <strong id="settingsLanguageLabel">English</strong>
          <span class="settings-chevron" aria-hidden="true"></span>
        </span>
      </button>

      <div class="settings-row">
        <span
          id="settingsReminderLabel"
          data-i18n="reminders.practice_reminders"
          >Practice reminders</span
        >
        <button
          type="button"
          class="settings-toggle"
          id="settingsNotificationsToggle"
          aria-label="Practice reminders"
          aria-labelledby="settingsReminderLabel"
          aria-describedby="practiceReminderStatus"
          aria-pressed="false"
        >
          <span class="settings-toggle__thumb"></span>
        </button>
      </div>

      <label class="settings-row" for="practiceReminderTime">
        <span data-i18n="reminders.reminder_time">Reminder time</span>
        <input type="time" id="practiceReminderTime" value="18:00" />
      </label>
      <p
        class="practice-reminder-description"
        id="practiceReminderStatus"
        role="status"
      >
        Choose gentle reminders after 1, 3, 7 and 30 days without practice.
      </p>
    </section>
    <section class="settings-section" aria-labelledby="settingsDownloads">
      <h2
        class="settings-section-title"
        id="settingsDownloads"
        data-i18n="profileLayout.downloads"
      >
        Downloads
      </h2>
      <button
        type="button"
        class="settings-row settings-row--link"
        id="settingsDownloadedContentsBtn"
      >
        <span data-i18n="auto.settings.downloaded_contents"
          >Downloaded contents</span
        >
        <span class="settings-row__value">
          <strong data-i18n="auto.settings.view">View</strong>
          <span class="settings-chevron" aria-hidden="true"></span>
        </span>
      </button>
    </section>

    <section class="settings-section" aria-labelledby="settingsHelp">
      <h2
        class="settings-section-title"
        id="settingsHelp"
        data-i18n="profileLayout.help"
      >
        Help &amp; information
      </h2>
      <button
        type="button"
        class="settings-row settings-row--link"
        id="settingsPrivacyBtn"
      >
        <span data-i18n="auto.settings.privacy_data_consent"
          >Privacy / data consent</span
        >
        <span class="settings-row__value">
          <strong data-i18n="auto.settings.view">View</strong>
          <span class="settings-chevron" aria-hidden="true"></span>
        </span>
      </button>

      <a
        class="settings-row settings-row--link"
        href="mailto:support@arclightproject.com"
      >
        <span data-i18n="auto.settings.help_contact">Help / contact</span>
        <span class="settings-row__value">
          <strong data-i18n="auto.settings.email">Email</strong>
          <span class="settings-chevron" aria-hidden="true"></span>
        </span>
      </a>
    </section>

    <section
      class="settings-section settings-section--actions"
      aria-label="Account"
    >
      <button
        type="button"
        class="settings-action settings-action--secondary"
        id="settingsLogoutBtn"
      >
        <svg
          class="settings-action__icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M9 5H5v14h4M13 8l4 4-4 4M9 12h12" />
        </svg>
        <span data-i18n="profileLayout.log_out">Log out</span>
        <span class="settings-chevron" aria-hidden="true"></span>
      </button>
      <button
        type="button"
        class="settings-action settings-action--danger"
        id="settingsDeleteAccountBtn"
      >
        <svg
          class="settings-action__icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5" />
        </svg>
        <span data-i18n="account.delete_account">Delete account</span>
        <span class="settings-chevron" aria-hidden="true"></span>
      </button>
    </section>

    <p class="settings-status" id="settingsStatus" role="status"></p>
    <p class="settings-version">
      <span data-i18n="auto.settings.app_version">App version</span>
      <span id="settingsAppVersion">ver --.--.----</span>
    </p>
  </div>
</div>
