<!-- My Learning Page — Displays a user's personalized learning content, including in-progress modules, liked items, and notes, with search and category filtering. -->
<div class="page" id="likedPage">
  <div class="ml-header">
    <div class="ml-topbar">
      <div class="ml-title" data-i18n="myLearningTitle">My Learning</div>
      <div class="ml-icons">
        <span
          class="icon menuBtn"
          aria-label="Menu"
          data-i18n="i18nExtra.menu_aria_label:aria-label"
          >&#9776;</span
        >
      </div>
    </div>

    <div class="ml-tabs">
      <button class="ml-tab" data-i18n="inProgressTab">In progress</button>
      <button class="ml-tab active" data-i18n="likedTab">Liked</button>
      <button class="ml-tab" data-i18n="notesTab">Notes</button>
    </div>

    <div class="search-wrap">
      <input
        type="search"
        id="mlSearch"
        aria-label="Search my learning contents"
        placeholder="Search for contents"
        data-i18n="searchPlaceholder:placeholder"
      />
      <span class="search-icon" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </span>
    </div>

    <div class="ml-chip-row">
      <button class="ml-chip active" data-filter="eyes" data-i18n="eyesFilter">
        Eyes
      </button>
      <button class="ml-chip" data-filter="ears" data-i18n="earsFilter">
        Ears
      </button>
      <button class="ml-chip" data-filter="skin" data-i18n="skinFilter">
        Skin
      </button>
      <button class="ml-chip" data-filter="teach" data-i18n="howToTeachFilter">
        How to Teach
      </button>
    </div>
  </div>

  <div class="container ml-container">
    <div id="likedMasonry" class="ml-masonry"></div>
  </div>

  <template id="mlCardTemplate">
    <button type="button" class="ml-card">
      <img class="ml-card-bg" alt="" decoding="async" draggable="false" />
      <div class="ml-card-header">
        <h4></h4>
        <span class="ml-heart">❤</span>
      </div>
      <div class="ml-badges"></div>
    </button>
  </template>
</div>
