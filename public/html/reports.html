<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title data-i18n="auto.reports.arclight_reports">Arclight Reports</title>
    <meta name="robots" content="noindex,nofollow" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 16px;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: auto;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      thead th {
        position: sticky;
        top: 0;
        background: #fafafa;
        z-index: 1;
      }
      .status {
        font-size: 0.9rem;
        opacity: 0.8;
      }
      #worldMap {
        width: 100%;
        height: 360px;
        border: 1px solid #ddd;
        border-radius: 10px;
        overflow: hidden;
        background: #f7f7f7;
      }
      .statsGrid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
        margin: 12px 0 16px;
      }
      .statCard {
        border: 1px solid #e7e7e7;
        border-radius: 12px;
        padding: 12px;
        background: #fff;
      }
      .statCard h3 {
        margin: 0 0 8px;
        font-size: 14px;
      }
      .kv {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 13px;
      }

      /* Stat charts */
      .statChart {
        display: grid;
        gap: 8px;
      }
      .barRow {
        display: grid;
        grid-template-columns: 1fr 46px;
        align-items: center;
        gap: 10px;
      }
      .barLabel {
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .barValue {
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-size: 13px;
      }
      .barTrack {
        height: 10px;
        border-radius: 999px;
        background: #eee;
        overflow: hidden;
        margin-top: 6px;
      }
      .barFill {
        height: 100%;
        border-radius: 999px;
        background: #111;
        width: 0%;
        transition: width 250ms ease;
      }

      /* Donut */
      .donutWrap {
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 12px;
        align-items: center;
      }
      .donut {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: conic-gradient(
          #111 0 25%,
          #666 0 40%,
          #aaa 0 55%,
          #ddd 0 100%
        );
        position: relative;
      }
      .donut::after {
        content: "";
        position: absolute;
        inset: 18px;
        background: #fff;
        border-radius: 50%;
      }
      .donutCenter {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 12px;
        text-align: center;
        z-index: 1;
      }
      .legend {
        display: grid;
        gap: 6px;
      }
      .legendItem {
        display: grid;
        grid-template-columns: 10px 1fr auto;
        gap: 8px;
        align-items: center;
        font-size: 12px;
      }
      .legendSwatch {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        background: #111;
      }

      /* KPI */
      .kpiGrid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }
      .kpi {
        border: 1px solid #e7e7e7;
        border-radius: 10px;
        padding: 10px;
        background: #fafafa;
      }
      .kpiLabel {
        font-size: 12px;
        color: #666;
      }
      .kpiValue {
        font-size: 18px;
        font-variant-numeric: tabular-nums;
        margin-top: 4px;
      }
      .reports-separator {
        margin: 24px 0;
        opacity: 0.25;
      }
      .reports-section-title {
        margin: 0 0 8px;
      }
      .reports-map-status {
        font-size: 12px;
        opacity: 0.7;
        margin-top: 6px;
      }
    </style>
    <section class="statsGrid" aria-label="Statistics">
      <div class="statCard">
        <h3 data-i18n="myprofile.interest">Interest</h3>
        <div id="statsInterest"></div>
      </div>
      <div class="statCard">
        <h3 data-i18n="onboarding.experience_label">Experience</h3>
        <div id="statsExperience"></div>
      </div>
      <div class="statCard">
        <h3 data-i18n="auto.reports.country_and_area">Country and area</h3>
        <div id="statsCountryArea"></div>
      </div>
      <div class="statCard">
        <h3 data-i18n="menu.language_item">Language</h3>
        <div id="statsLanguage"></div>
      </div>
      <div class="statCard">
        <h3 data-i18n="auto.reports.refresh_count">Refresh count</h3>
        <div id="statsRefresh"></div>
      </div>
    </section>
  </head>
  <body>
    <div class="toolbar">
      <button
        id="refreshBtn"
        type="button"
        data-i18n="auto.reports.refresh_data"
      >
        Refresh data
      </button>
      <span id="status" class="status" data-i18n="auto.reports.loaded_0_rows"
        >Loaded 0 rows</span
      >
    </div>

    <table id="users">
      <thead>
        <tr>
          <th data-i18n="i18nExtra.no">No.</th>
          <th data-i18n="onboarding.username_label">Name</th>
          <th data-i18n="auto.reports.aims">Aims</th>
          <th data-i18n="myprofile.interest">Interest</th>
          <th data-i18n="onboarding.experience_label">Experience</th>
          <th data-i18n="auto.reports.contact">Contact</th>
          <th data-i18n="auto.reports.country">Country</th>
          <th data-i18n="auto.reports.area">Area</th>
          <th data-i18n="menu.language_item">Language</th>
          <th data-i18n="auto.reports.refresh_count">Refresh count</th>
          <th data-i18n="auto.reports.when">When</th>
          <th data-i18n="auto.reports.delete">Delete</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <hr class="reports-separator" />
    <h3 class="reports-section-title" data-i18n="auto.reports.user_locations">
      User locations
    </h3>
    <div id="worldMap"></div>
    <p
      id="mapStatus"
      class="reports-map-status"
      data-i18n="i18nExtra.loading_map"
    >
      Loading map…
    </p>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="/js/safe-console-init.js"></script>
    <script type="module" src="/js/reports.js"></script>
  </body>
</html>
