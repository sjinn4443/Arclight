<!-- Atoms Card Page — Displays detailed information about anatomical structures (Atoms) for eyes and ears, with a toggleable table of contents. -->
<div id="atomsCardPage" class="page">
  <div class="atoms-title-bar" data-i18n="atomsCardTitle">Atoms Card</div>
  <div class="top-right-icons">
    <div
      class="atoms-card-zoom-controls diabetic-protocol-algorithm-controls"
      aria-label="Atoms card zoom controls"
    >
      <span aria-hidden="true"></span>
      <button
        id="atomsZoomOutBtn"
        type="button"
        aria-label="Zoom out"
        title="Zoom out"
      >
        -
      </button>
      <button
        id="atomsZoomInBtn"
        type="button"
        aria-label="Zoom in"
        title="Zoom in"
      >
        +
      </button>
    </div>
    <button
      id="tocToggleBtn"
      aria-label="Open table of contents"
      title="Table of Contents"
      data-i18n="tocToggleBtnTitle:aria-label;tocToggleBtnTitle:title"
      style="
        position: fixed;
        top: 60px;
        left: 10px;
        z-index: 4000;
        display: block;
        background: #e41e26;
        color: white;
        border: none;
        border-radius: 6px;
        padding: 8px 12px;
        font-size: 18px;
        width: 40px;
        height: 40px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      "
    >
      ☰
    </button>
  </div>
  <div id="tocDropdown" class="toc-dropdown active">
    <div class="toc-tab">
      <button id="eyesTab" class="active" data-i18n="eyesTab">Eyes</button>
      <button id="earsTab" data-i18n="earsTab">Ears</button>
    </div>
    <ul id="tocList"></ul>
    <button
      id="tocInlineCloseBtn"
      type="button"
      class="toc-inline-close"
      aria-label="Close table of contents"
      data-i18n="closeTOCBtnTitle:aria-label"
    >
      &times;
    </button>
  </div>
  <div
    id="atomsImageContainer"
    style="
      width: 100vw;
      min-height: 100vh;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
    "
  ></div>
  <button
    id="atomsPrevCardBtn"
    class="atoms-card-nav atoms-card-nav--prev"
    type="button"
    aria-label="Previous Atoms card"
    title="Previous Atoms card"
    disabled
  >
    &lt;
  </button>
  <button
    id="atomsNextCardBtn"
    class="atoms-card-nav atoms-card-nav--next"
    type="button"
    aria-label="Next Atoms card"
    title="Next Atoms card"
    disabled
  >
    &gt;
  </button>
</div>
