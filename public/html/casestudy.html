<!-- public/html/casestudy.html -->
<div id="casestudyPage" class="page has-eyes-topbar">
  <div class="container pupils-container">
    <div class="eyes-topbar">
      <div class="eyes-topbar__title">Eyes</div>
      <div class="eyes-topbar__icons">
        <span class="icon menuBtn" aria-label="Menu">☰</span>
      </div>
    </div>

    <h2 class="pupils-subtitle">History taking</h2>

    <div class="pupils-levels">
      <!-- Primary -->
      <section class="pupil-level pupil-level--primary" aria-label="Primary">
        <div class="pupil-level__cap">Primary</div>

        <button
          type="button"
          class="pupil-card module-card"
          id="caseStudyPrimaryCard"
        >
          <h3>Case study</h3>

          <div
            class="lesson-row lesson-row--quiz"
            role="button"
            tabindex="0"
            data-level="primary"
          >
            <div class="thumb" aria-hidden="true"></div>

            <div class="lesson-main">
              <div class="lesson-top">
                <span class="lesson-type">Case Study</span>
                <span class="lesson-meta">|</span>
              </div>

              <div
                class="lesson-progress"
                role="progressbar"
                aria-valuemin="0"
                aria-valuemax="100"
              >
                <div class="lesson-progress__fill" style="width: 0%"></div>
              </div>
            </div>

            <span class="lesson-cta">Start &gt;</span>
          </div>
        </button>
      </section>

      <div class="pupils-dots" aria-hidden="true">
        <span></span><span></span>
      </div>

      <!-- Intermediate -->
      <section
        class="pupil-level pupil-level--intermediate"
        aria-label="Intermediate"
      >
        <div class="pupil-level__cap">Intermediate</div>

        <button
          type="button"
          class="pupil-card module-card"
          id="caseStudyIntermediateCard"
        >
          <h3>Case study</h3>

          <div
            class="lesson-row lesson-row--quiz"
            role="button"
            tabindex="0"
            data-level="intermediate"
          >
            <div class="thumb" aria-hidden="true"></div>

            <div class="lesson-main">
              <div class="lesson-top">
                <span class="lesson-type">Case Study</span>
                <span class="lesson-meta">|</span>
              </div>

              <div
                class="lesson-progress"
                role="progressbar"
                aria-valuemin="0"
                aria-valuemax="100"
              >
                <div class="lesson-progress__fill" style="width: 0%"></div>
              </div>
            </div>

            <span class="lesson-cta">Start &gt;</span>
          </div>
        </button>
      </section>
    </div>
  </div>
</div>

<!-- ✅ merged chat page (was casestudychat.html) -->
<div id="caseStudyChatPage" class="page has-eyes-topbar" style="display: none">
  <div class="container pupils-container">
    <div class="eyes-topbar">
      <div class="eyes-topbar__title">Eyes</div>
      <div class="eyes-topbar__icons">
        <button class="casechat-back" id="caseChatBackBtn" aria-label="Back">
          ‹
        </button>
        <span class="icon menuBtn" aria-label="Menu">☰</span>
      </div>
    </div>

    <h2 class="pupils-subtitle">Case study</h2>

    <div class="casechat">
      <div class="casechat-log" id="caseChatLog" aria-live="polite"></div>

      <div
        class="casechat-choices"
        id="caseChatChoices"
        aria-label="Questions"
      ></div>

      <button type="button" class="casechat-submit" id="caseChatSubmitBtn">
        Submit answer
      </button>
    </div>
  </div>

  <!-- Diagnosis modal -->
  <div class="casechat-modal" id="caseDxModal" hidden>
    <div
      class="casechat-modalCard"
      id="caseDxCard"
      role="dialog"
      aria-modal="true"
    >
      <div class="casechat-modalTop">
        <div class="casechat-modalTitle">Select the most likely diagnosis</div>
        <button
          type="button"
          class="casechat-modalClose"
          id="caseDxCloseBtn"
          aria-label="Close"
        >
          ×
        </button>
      </div>
      <div class="casechat-dxList" id="caseDxList"></div>
    </div>
  </div>

  <!-- Result modal -->
  <div class="casechat-modal" id="caseResultModal" hidden>
    <div
      class="casechat-modalCard"
      id="caseResultCard"
      role="dialog"
      aria-modal="true"
    >
      <div class="casechat-modalTop">
        <div class="casechat-modalTitle" id="caseResultTitle">Result</div>
        <button
          type="button"
          class="casechat-modalClose"
          id="caseResultCloseBtn"
          aria-label="Close"
        >
          ×
        </button>
      </div>

      <div class="casechat-resultBody" id="caseResultBody"></div>

      <button type="button" class="casechat-next" id="caseNextBtn">
        Next case
      </button>
    </div>
  </div>
</div>
