<!-- public/html/casestudy.html -->
<div id="casestudyPage" class="page has-eyes-topbar">
  <div class="container pupils-container">
    <div class="eyes-topbar">
      <div class="eyes-topbar__title">Eyes</div>
      <div class="eyes-topbar__icons">
        <span class="icon menuBtn" aria-label="Menu">☰</span>
      </div>
    </div>

    <h2 class="pupils-subtitle">History taking</h2>

    <div class="pupils-levels">
      <!-- Primary -->
      <section class="pupil-level pupil-level--primary" aria-label="Primary">
        <div class="pupil-level__cap">Primary</div>

        <button
          type="button"
          class="pupil-card module-card"
          id="caseStudyPrimaryCard"
        >
          <h3>Case study</h3>

          <div
            class="lesson-row lesson-row--quiz"
            role="button"
            tabindex="0"
            data-level="primary"
          >
            <div class="thumb" aria-hidden="true"></div>

            <div class="lesson-main">
              <div class="lesson-top">
                <span class="lesson-type">Case Study</span>
                <span class="lesson-meta">|</span>
              </div>

              <div
                class="lesson-progress"
                role="progressbar"
                aria-valuemin="0"
                aria-valuemax="100"
              >
                <div class="lesson-progress__fill" style="width: 0%"></div>
              </div>
            </div>

            <span class="lesson-cta">Start &gt;</span>
          </div>
        </button>
      </section>

      <div class="pupils-dots" aria-hidden="true">
        <span></span><span></span>
      </div>

      <!-- Intermediate -->
      <section
        class="pupil-level pupil-level--intermediate"
        aria-label="Intermediate"
      >
        <div class="pupil-level__cap">Intermediate</div>

        <button
          type="button"
          class="pupil-card module-card"
          id="caseStudyIntermediateCard"
        >
          <h3>Case study</h3>

          <div
            class="lesson-row lesson-row--quiz"
            role="button"
            tabindex="0"
            data-level="intermediate"
          >
            <div class="thumb" aria-hidden="true"></div>

            <div class="lesson-main">
              <div class="lesson-top">
                <span class="lesson-type">Case Study</span>
                <span class="lesson-meta">|</span>
              </div>

              <div
                class="lesson-progress"
                role="progressbar"
                aria-valuemin="0"
                aria-valuemax="100"
              >
                <div class="lesson-progress__fill" style="width: 0%"></div>
              </div>
            </div>

            <span class="lesson-cta">Start &gt;</span>
          </div>
        </button>
      </section>
    </div>
  </div>
</div>

<!-- ✅ merged chat page (keep only ONE of these in the file) -->
<div id="caseStudyChatPage" class="page has-eyes-topbar" style="display: none">
  <div class="container pupils-container">
    <div class="eyes-topbar">
      <div class="eyes-topbar__title">Case Study</div>
      <div class="eyes-topbar__icons">
        <span class="icon menuBtn" aria-label="Menu">☰</span>
      </div>
    </div>

    <!-- 채팅 로그 -->
    <div id="caseChatLog" class="casechat-log"></div>

    <!-- Bottom sheet -->
    <div class="casechat-footer">
      <button
        id="caseChatSubmitBtn"
        class="casechat-submitpill"
        type="button"
        disabled
      >
        Submit Answer <span class="chev">&gt;</span>
      </button>

      <!-- chips -->
      <div id="caseChatChoices" class="casechat-choices"></div>

      <!-- draft input row (pic 1처럼) -->
      <div class="casechat-composer" role="group" aria-label="Case chat input">
        <button
          id="caseChatToggleBtn"
          class="casechat-toggle"
          type="button"
          aria-label="Toggle question chips"
        >
          Q
        </button>

        <div id="caseChatDraft" class="casechat-draft">- Select a question</div>
        <button
          id="caseChatSendBtn"
          class="casechat-send"
          type="button"
          disabled
          aria-label="Send"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 512 512"
            width="19"
            height="19"
            aria-hidden="true"
            focusable="false"
            class="send-icon"
          >
            <path
              d="M476.59 227.05l-.16-.07L49.35 49.84A23.56 23.56 0 0027.14 52 24.65 24.65 0 0016 72.59v113.29a24 24 0 0019.52 23.57l232.93 43.07a4 4 0 010 7.86L35.53 303.45A24 24 0 0016 327v113.31A23.57 23.57 0 0026.59 460a23.94 23.94 0 0013.22 4 24.55 24.55 0 009.52-1.93L476.4 285.94l.19-.09a32 32 0 000-58.8z"
              fill="currentColor"
            />
          </svg>
        </button>
      </div>
    </div>

    <!-- Dx 선택 모달 -->
    <div id="caseDxModal" hidden class="casechat-modal">
      <div class="casechat-modal__content">
        <div class="casechat-modal__top">
          <div class="casechat-modal__title">Select diagnosis</div>
          <button
            id="caseDxCloseBtn"
            class="casechat-modal__close"
            aria-label="Close"
          >
            ✕
          </button>
        </div>

        <div id="caseDxList" class="casechat-dxlist"></div>
        <div id="caseDxCard" class="casechat-dxcard"></div>
      </div>
    </div>

    <!-- 결과 모달 -->
    <div id="caseResultModal" hidden class="casechat-modal">
      <div class="casechat-modal__content">
        <div class="casechat-modal__top">
          <div id="caseResultTitle" class="casechat-modal__title">Result</div>
          <button
            id="caseResultCloseBtn"
            class="casechat-modal__close"
            aria-label="Close"
          >
            ✕
          </button>
        </div>

        <div id="caseResultBody" class="casechat-result"></div>

        <div class="casechat-modal__actions">
          <button id="caseNextBtn" class="start-btn" type="button">
            Next case
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
