<!-- public/html/casestudy.html -->
<div id="casestudyPage" class="page has-eyes-topbar">
  <div class="container pupils-container">
    <div class="eyes-topbar">
      <div class="eyes-topbar__title">Eyes</div>
      <div class="eyes-topbar__icons">
        <span class="icon menuBtn" aria-label="Menu">☰</span>
      </div>
    </div>

    <h2 class="pupils-subtitle">History taking</h2>

    <div class="pupils-levels">
      <!-- Primary -->
      <section class="pupil-level pupil-level--primary" aria-label="Primary">
        <div class="pupil-level__cap">Primary</div>

        <button
          type="button"
          class="pupil-card module-card"
          id="caseStudyPrimaryCard"
        >
          <h3>Case study</h3>

          <div
            class="lesson-row lesson-row--quiz"
            role="button"
            tabindex="0"
            data-level="primary"
          >
            <div class="thumb" aria-hidden="true"></div>

            <div class="lesson-main">
              <div class="lesson-top">
                <span class="lesson-type">Case Study</span>
                <span class="lesson-meta">|</span>
              </div>

              <div
                class="lesson-progress"
                role="progressbar"
                aria-valuemin="0"
                aria-valuemax="100"
              >
                <div class="lesson-progress__fill" style="width: 0%"></div>
              </div>
            </div>

            <span class="lesson-cta">Start &gt;</span>
          </div>
        </button>
      </section>

      <div class="pupils-dots" aria-hidden="true">
        <span></span><span></span>
      </div>

      <!-- Intermediate -->
      <section
        class="pupil-level pupil-level--intermediate"
        aria-label="Intermediate"
      >
        <div class="pupil-level__cap">Intermediate</div>

        <button
          type="button"
          class="pupil-card module-card"
          id="caseStudyIntermediateCard"
        >
          <h3>Case study</h3>

          <div
            class="lesson-row lesson-row--quiz"
            role="button"
            tabindex="0"
            data-level="intermediate"
          >
            <div class="thumb" aria-hidden="true"></div>

            <div class="lesson-main">
              <div class="lesson-top">
                <span class="lesson-type">Case Study</span>
                <span class="lesson-meta">|</span>
              </div>

              <div
                class="lesson-progress"
                role="progressbar"
                aria-valuemin="0"
                aria-valuemax="100"
              >
                <div class="lesson-progress__fill" style="width: 0%"></div>
              </div>
            </div>

            <span class="lesson-cta">Start &gt;</span>
          </div>
        </button>
      </section>
    </div>
  </div>
</div>
