<!-- Dashboard Page — Provides a personalized user dashboard with greetings, search functionality, category navigation, quick actions, and recommended content. -->
<div id="unifiedDashboard" class="page">
  <div class="container unified-container">
    <!-- Greeting + search -->
    <div class="unified-top">
      <div class="hello-wrap">
        <div class="hello" data-i18n="dashboard.greeting">Hello Sujin!</div>
      </div>

      <div class="icons">
        <!-- ✅ compact search next to ☰ -->
        <div class="search-wrap search-wrap--compact search-collapsed">
          <input
            type="search"
            aria-label="Search contents"
            placeholder="Search for contents"
            data-i18n="dashboard.search_placeholder:placeholder"
          />
          <span
            class="search-icon"
            id="dashboardSearchToggle"
            aria-hidden="true"
          >
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
        </div>

        <span
          class="icon menuBtn"
          aria-label="Menu"
          data-i18n="i18nExtra.menu_aria_label:aria-label"
          >&#9776;</span
        >
      </div>
    </div>

    <!-- Horizontal category slider -->
    <div class="category-carousel" id="categoryCarousel">
      <button
        class="category-card"
        data-target="eyesCatalogPage"
        data-label="Eyes"
        aria-label="Eyes"
        data-i18n="dashboard.category_eyes:aria-label"
      >
        <img
          class="category-card__bg"
          src="images/icon/dashboard/eyes-260.webp"
          srcset="
            images/icon/dashboard/eyes-260.webp 260w,
            images/icon/dashboard/eyes-520.webp 520w
          "
          sizes="(max-width: 480px) 260px, 260px"
          alt="Eyes"
          width="260"
          height="179"
          decoding="async"
          draggable="false"
          data-i18n="dashboard.category_eyes:alt"
        />
        <span class="category-card__title" data-i18n="dashboard.category_eyes"
          >Eyes</span
        >
      </button>

      <button
        class="category-card"
        data-target="earsLearningModules"
        data-label="Ears"
        aria-label="Ears"
        data-i18n="dashboard.category_ears:aria-label"
      >
        <img
          class="category-card__bg"
          src="images/icon/dashboard/ears-260.webp"
          srcset="
            images/icon/dashboard/ears-260.webp 260w,
            images/icon/dashboard/ears-520.webp 520w
          "
          sizes="(max-width: 480px) 260px, 260px"
          alt="Ears"
          width="260"
          height="179"
          decoding="async"
          draggable="false"
          data-i18n="dashboard.category_ears:alt"
        />
        <span class="category-card__title" data-i18n="dashboard.category_ears"
          >Ears</span
        >
      </button>

      <button
        class="category-card"
        data-target="skinModules"
        data-label="Skin"
        aria-label="Skin"
        data-i18n="dashboard.category_skin:aria-label"
      >
        <img
          class="category-card__bg"
          src="images/icon/dashboard/skin-260.webp"
          srcset="
            images/icon/dashboard/skin-260.webp 260w,
            images/icon/dashboard/skin-520.webp 520w
          "
          sizes="(max-width: 480px) 260px, 260px"
          alt="Skin"
          width="260"
          height="179"
          decoding="async"
          draggable="false"
          data-i18n="dashboard.category_skin:alt"
        />
        <span class="category-card__title" data-i18n="dashboard.category_skin"
          >Skin</span
        >
      </button>
    </div>

    <div class="carousel-dots" id="carouselDots">
      <button
        class="dot active"
        aria-label="Eyes"
        data-i18n="dashboard.category_eyes:aria-label"
      ></button>
      <button
        class="dot"
        aria-label="Ears"
        data-i18n="dashboard.category_ears:aria-label"
      ></button>
      <button
        class="dot"
        aria-label="Skin"
        data-i18n="dashboard.category_skin:aria-label"
      ></button>
    </div>

    <!-- Quick actions -->
    <div class="quick-actions">
      <button class="pill" data-i18n="dashboard.quick_action_atoms_card">
        Atoms Card
      </button>
      <button class="pill" data-i18n="dashboard.quick_action_my_notes">
        My Notes
      </button>
      <button class="pill" data-i18n="dashboard.quick_action_alan">Alan</button>
      <button class="pill" data-i18n="dashboard.quick_action_download_contents">
        Download
      </button>
    </div>

    <!-- Recommended for you -->
    <h3 class="section-title" data-i18n="dashboard.recommended_title">
      Recommended for you
      <span class="see-all" data-i18n="dashboard.see_all">See all ></span>
    </h3>
    <div class="learning-placeholder" id="recommendedPlaceholder"></div>

    <template id="dashboardRecommendedCardTemplate">
      <div class="module-card">
        <img src="" alt="" draggable="false" />
        <div class="module-info">
          <h3 class="module-title"></h3>
          <p class="module-subtitle"></p>
          <div class="progress-bar"><div class="progress"></div></div>
        </div>
      </div>
    </template>
  </div>
</div>

<!-- Simple placeholder pages -->
<div id="skinModules" class="page">
  <div class="container">
    <h1 data-i18n="dashboard.category_skin">Skin</h1>
    <p data-i18n="dashboard.coming_soon">Coming soon.</p>
  </div>
</div>
