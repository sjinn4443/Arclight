<!-- Interest Page — Allows users to select their professional interests to personalize content recommendations within the app. -->
<div id="proInterestPage" class="page">
  <div class="container interest-container">
    <h1 class="interest-title" data-i18n="interest.title">
      What are your goals?
    </h1>
    <!--<p class="interest-sub" data-i18n="interest.subtitle">
      This will help us offer better contents
    </p> -->

    <!-- Group 1 -->
    <div class="interest-group">
      <div
        class="interest-group-title"
        data-i18n="interest.group_professional_development"
      >
        Professional Development
      </div>
      <div class="chip-row">
        <button
          type="button"
          class="chip"
          data-i18n="interest.chip_learn_core_basics"
        >
          Learn core basics
        </button>
        <button
          type="button"
          class="chip"
          data-i18n="interest.chip_refresher_practice"
        >
          Refresher practice
        </button>
        <button
          type="button"
          class="chip"
          data-i18n="interest.chip_specialist_training"
        >
          Specialist training
        </button>
      </div>
    </div>

    <!-- Group 2 -->
    <div class="interest-group">
      <div
        class="interest-group-title"
        data-i18n="interest.group_education_learning"
      >
        Education & Learning
      </div>
      <div class="chip-row">
        <button
          type="button"
          class="chip"
          data-i18n="interest.chip_for_my_studies"
        >
          For my studies
        </button>
        <button
          type="button"
          class="chip"
          data-i18n="interest.chip_teaching_others"
        >
          Teaching others
        </button>
      </div>
    </div>

    <!-- Group 3 -->
    <div class="interest-group">
      <div
        class="interest-group-title"
        data-i18n="interest.group_global_health_innovation"
      >
        Global Health and Innovation
      </div>
      <div class="chip-row">
        <button
          type="button"
          class="chip"
          data-i18n="interest.chip_low_resource_kits"
        >
          Frugal kits
        </button>
        <button
          type="button"
          class="chip"
          data-i18n="interest.chip_public_health"
        >
          Public health
        </button>
      </div>
    </div>

    <!-- bottom CTA -->
    <button
      id="interestSubmitBtn"
      class="onb-cta interest-cta"
      data-i18n="interest.submit_button"
    >
      Join Us !
    </button>
  </div>
</div>
