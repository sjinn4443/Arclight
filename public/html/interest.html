<!-- Interest Page — Allows users to select their professional interests to personalize content recommendations within the app. -->
<div id="proInterestPage" class="page">
  <div class="container interest-container">
    <h1 class="interest-title">
      What do you want to<br />achieve with this app?
    </h1>
    <p class="interest-sub">This will help us offer better contents</p>

    <!-- Group 1 -->
    <div class="interest-group">
      <div class="interest-group-title">Professional Development</div>
      <div class="chip-row">
        <button type="button" class="chip">Learn core basics</button>
        <button type="button" class="chip">Refresher practice</button>
        <button type="button" class="chip">Specialist training</button>
      </div>
    </div>

    <!-- Group 2 -->
    <div class="interest-group">
      <div class="interest-group-title">Education & Learning</div>
      <div class="chip-row">
        <button type="button" class="chip">For my studies</button>
        <button type="button" class="chip">Teaching others</button>
      </div>
    </div>

    <!-- Group 3 -->
    <div class="interest-group">
      <div class="interest-group-title">Global Health &amp; Innovation</div>
      <div class="chip-row">
        <button type="button" class="chip">Low-resource kits</button>
        <button type="button" class="chip">Public health</button>
      </div>
    </div>

    <!-- bottom CTA -->
    <button id="interestSubmitBtn" class="onb-cta interest-cta">
      Join Us !
    </button>
  </div>
</div>
