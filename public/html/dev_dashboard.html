<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Arclight Dev Dashboard</title>
    <meta name="robots" content="noindex,nofollow" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 16px;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: auto; /* let content influence column widths */
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* Long free-text columns: show full text and wrap */
      th:nth-child(3),
      th:nth-child(4),
      th:nth-child(5),
      td:nth-child(3),
      td:nth-child(4),
      td:nth-child(5) {
        white-space: normal; /* allow wrapping */
        overflow: visible; /* no clipping */
        text-overflow: clip; /* remove ellipsis */
        word-break: break-word; /* wrap long words cleanly */
        vertical-align: top;
      }
      thead th {
        position: sticky;
        top: 0;
        background: #fafafa;
        z-index: 1;
      }
      /* No. column */
      th:nth-child(1) {
        width: 50px;
        text-align: right;
      }
      td:nth-child(1) {
        text-align: right;
        white-space: nowrap;
      }

      /* Language column */
      th:nth-child(9),
      td:nth-child(9) {
        width: 90px;
        white-space: nowrap;
      }

      /* Refresh count column */
      th:nth-child(10),
      td:nth-child(10) {
        width: 90px;
        text-align: right;
        white-space: nowrap;
      }
      /* Delete column: keep it compact */
      th:nth-child(11),
      td:nth-child(11) {
        width: 64px;
        text-align: center;
        white-space: nowrap;
      }

      /* Bin button */
      .deleteBtn {
        border: none;
        background: transparent;
        cursor: pointer;
        padding: 4px;
        font-size: 16px;
        line-height: 1;
        opacity: 0.75;
      }

      .deleteBtn:hover {
        opacity: 1;
      }
      .deleteBtn:focus-visible {
        outline: 2px solid #79b8ff;
        border-radius: 6px;
      }
      .status {
        font-size: 0.9rem;
        opacity: 0.8;
      }
      #worldMap {
        width: 100%;
        height: 360px;
        border: 1px solid #ddd;
        border-radius: 10px;
        overflow: hidden;
        background: #f7f7f7;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button id="refreshBtn" type="button">Refresh data</button>
      <span id="status" class="status">Loaded 0 rows</span>
    </div>

    <table id="users">
      <thead>
        <tr>
          <th>No. <small></small></th>
          <th>Name</th>
          <th>Aims</th>
          <th>Interest</th>
          <th>Experience</th>
          <th>Contact</th>
          <th>Country</th>
          <th>Area</th>
          <th>Language</th>
          <th>Refresh count</th>
          <!-- NEW -->
          <th>Delete</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <hr style="margin: 24px 0; opacity: 0.25" />

    <h3 style="margin: 0 0 8px 0">User locations</h3>
    <div id="worldMap"></div>
    <p id="mapStatus" style="font-size: 12px; opacity: 0.7; margin-top: 6px">
      Loading map…
    </p>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="/js/dev_dashboard.js"></script>
  </body>
</html>
