<!-- Splash Screen Page — Displays the initial splash screen with animated logos when the app loads. -->
<main
  class="splash-wrap"
  aria-label="Splash screen"
  data-i18n="splashscreen.ariaLabel"
>
  <img
    class="logo-one"
    src="images/logo/1.webp"
    alt="Logo One"
    width="512"
    height="512"
    data-i18n="splashscreen.logoOneAlt:alt"
  />
  <img
    class="logo-two"
    src="images/logo/2.webp"
    alt="Logo Two"
    width="512"
    height="512"
    data-i18n="splashscreen.logoTwoAlt:alt"
  />
</main>
