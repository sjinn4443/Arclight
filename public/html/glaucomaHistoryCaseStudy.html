<!-- public/html/glaucomaHistoryCaseStudy.html -->
<div id="glaucomaHistoryCaseStudy" class="page has-eyes-topbar">
  <div class="container pupils-container">
    <div class="eyes-topbar">
      <div
        class="eyes-topbar__title"
        data-i18n="auto.glaucomahistorycasestudy.case_study"
      >
        Case Study
      </div>
      <div class="eyes-topbar__icons">
        <button
          id="caseTimerBtn"
          class="caseTimer"
          type="button"
          aria-label="Case timer"
        >
          <svg
            class="caseTimer__svg"
            viewBox="0 0 36 36"
            aria-hidden="true"
            focusable="false"
          >
            <path
              class="caseTimer__bg"
              d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
            />
            <path
              class="caseTimer__fg"
              d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
            />
            <text id="caseTimerText" x="18" y="21" class="caseTimer__text">
              60
            </text>
          </svg>
        </button>

        <span class="icon menuBtn" aria-label="Menu">☰</span>
      </div>
    </div>

    <!-- 채팅 로그 -->
    <div id="caseChatLog" class="casechat-log"></div>

    <div
      class="casechat-footer-mask"
      id="caseChatFooterMask"
      aria-hidden="true"
    ></div>

    <!-- Bottom sheet -->
    <div class="casechat-footer">
      <button
        id="caseChatSubmitBtn"
        class="casechat-submitpill"
        type="button"
        disabled
      >
        Select Diagnosis
        <span class="chev" data-i18n="auto.glaucomahistorycasestudy.text"
          >&gt;</span
        >
      </button>

      <!-- chips -->
      <div id="caseChatChoices" class="casechat-choices"></div>

      <!-- composer -->
      <div class="casechat-composer" role="group" aria-label="Case chat input">
        <button
          id="caseChatToggleBtn"
          class="casechat-toggle"
          type="button"
          aria-label="Toggle question chips"
        >
          Q
        </button>

        <div id="caseChatDraft" class="casechat-draft">
          Click here to select a question
        </div>

        <button
          id="caseChatSendBtn"
          class="casechat-send"
          type="button"
          disabled
          aria-label="Send"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 512 512"
            width="19"
            height="19"
            aria-hidden="true"
            focusable="false"
            class="send-icon"
          >
            <path
              d="M476.59 227.05l-.16-.07L49.35 49.84A23.56 23.56 0 0027.14 52 24.65 24.65 0 0016 72.59v113.29a24 24 0 0019.52 23.57l232.93 43.07a4 4 0 010 7.86L35.53 303.45A24 24 0 0016 327v113.31A23.57 23.57 0 0026.59 460a23.94 23.94 0 0013.22 4 24.55 24.55 0 009.52-1.93L476.4 285.94l.19-.09a32 32 0 000-58.8z"
              fill="currentColor"
            />
          </svg>
        </button>
      </div>
    </div>

    <!-- Dx modal -->
    <div id="caseDxModal" hidden class="casechat-modal">
      <div class="casechat-modal__content">
        <div class="casechat-modal__top">
          <div
            class="casechat-modal__title"
            data-i18n="auto.glaucomahistorycasestudy.select_diagnosis"
          >
            Select diagnosis
          </div>

          <div class="casechat-modal__icons">
            <button
              id="caseDxTimerBtn"
              class="caseTimer caseTimer--sm"
              type="button"
              aria-label="Diagnosis timer"
            >
              <svg
                class="caseTimer__svg"
                viewBox="0 0 36 36"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  class="caseTimer__bg"
                  d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
                />
                <path
                  id="caseDxTimerFg"
                  class="caseTimer__fg"
                  d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
                />
                <text
                  id="caseDxTimerText"
                  x="18"
                  y="21"
                  class="caseTimer__text"
                >
                  10
                </text>
              </svg>
            </button>

            <button
              id="caseDxCloseBtn"
              class="casechat-modal__close"
              aria-label="Close"
              type="button"
            >
              ✕
            </button>
          </div>
        </div>

        <div id="caseDxList" class="casechat-dxlist"></div>
        <div id="caseDxCard" class="casechat-dxcard"></div>
      </div>
    </div>

    <!-- Complete modal -->
    <div id="caseFinalModal" hidden class="casechat-modal">
      <div class="casechat-modal__content">
        <div class="casechat-modal__top">
          <div
            class="casechat-modal__title"
            data-i18n="auto.glaucomahistorycasestudy.all_cases_completed"
          >
            All cases completed
          </div>
          <button
            id="caseFinalCloseBtn"
            class="casechat-modal__close"
            aria-label="Close"
            type="button"
          >
            ✕
          </button>
        </div>

        <div id="caseFinalBody" class="casechat-dxcard"></div>

        <div class="casechat-modal__actions"></div>
      </div>
    </div>

    <!-- result modal (kept for parity, not required but harmless) -->
    <div id="caseResultModal" hidden class="casechat-modal">
      <div class="casechat-modal__content">
        <div class="casechat-modal__top">
          <div
            id="caseResultTitle"
            class="casechat-modal__title"
            data-i18n="auto.glaucomahistorycasestudy.result"
          >
            Result
          </div>
          <button
            id="caseResultCloseBtn"
            class="casechat-modal__close"
            aria-label="Close"
            type="button"
          >
            ✕
          </button>
        </div>

        <div id="caseResultBody" class="casechat-result"></div>

        <div class="casechat-modal__actions">
          <button id="caseNextBtn" class="start-btn" type="button">
            Next case
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
