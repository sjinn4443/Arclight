<section id="frontOfEyePdfTestPage" class="page active has-eyes-topbar">
  <div class="container">
    <div class="eyes-topbar">
      <div class="eyes-topbar__title">Front of Eye PDF(test)</div>
      <div class="eyes-topbar__icons">
        <span
          class="icon menuBtn"
          role="button"
          tabindex="0"
          aria-label="Menu"
          data-i18n="i18nExtra.menu_aria_label:aria-label"
          >&#9776;</span
        >
      </div>
    </div>

    <div class="foe-book">
      <nav class="foe-book__sections" aria-label="Sections"></nav>
      <div class="foe-book__section fundal-reflex-section-divider">
        <h2
          id="foeBookSection"
          class="fundal-reflex-section-divider__title"
        ></h2>
      </div>
      <div
        class="foe-book__position"
        aria-live="polite"
        aria-atomic="true"
      ></div>
      <article class="foe-book__sheet" aria-labelledby="foeBookHeading">
        <h1 id="foeBookHeading" tabindex="-1"></h1>
        <p class="foe-book__hint">Tap an image to enlarge.</p>
        <div class="foe-book__panels"></div>
      </article>
      <nav class="foe-book__navigation" aria-label="PDF pages">
        <button type="button" class="childhood-prev-btn" data-book-previous>
          &lt; Previous
        </button>
        <span class="foe-book__page-number" aria-hidden="true"></span>
        <button
          type="button"
          class="childhood-next-btn is-ready"
          data-book-next
        >
          Next &gt;
        </button>
      </nav>
    </div>
  </div>
  <dialog class="foe-book__zoom" aria-label="Enlarged PDF illustration">
    <form method="dialog">
      <button type="submit" autofocus>Close ×</button>
    </form>
    <img alt="" />
  </dialog>
</section>
