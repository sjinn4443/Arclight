<!-- Eyes Page — Displays a catalog of eye-related content, categorized into core examination, diseases, primary eye care procedures, extended examination, and tools. -->
<div id="eyesCatalogPage" class="page">
  <div class="container eyes-container">
    <!-- Top bar (title + icons) -->
    <div class="eyes-top">
      <div class="eyes-title" data-i18n="eyesCatalogTitle">Eyes</div>
      <div class="icons">
        <span class="icon menuBtn" data-i18n="menuButton">☰</span>
      </div>
    </div>

    <!-- Core Examination -->
    <h2 class="catalog-h2" data-i18n="coreExaminationTitle">
      Core Examination <span class="see-all" data-i18n="seeAll">See all ></span>
    </h2>
    <div id="coreCarousel" class="eyes-carousel"></div>

    <!-- Conditions -->
    <h2 class="catalog-h2" data-i18n="diseaseTitle">
      Conditions <span class="see-all" data-i18n="seeAll">See all ></span>
    </h2>
    <div id="diseaseCarousel" class="eyes-carousel"></div>

    <!-- Primary Eye Care Procedures -->
    <h2 class="catalog-h2" data-i18n="primaryEyeCareProceduresTitle">
      Workshops
      <span class="see-all" data-i18n="seeAll">See all ></span>
    </h2>
    <div id="pecCarousel" class="eyes-carousel"></div>

    <!-- Extended Examination -->
    <h2 class="catalog-h2" data-i18n="extendedExaminationTitle">
      Extended Examination
      <span class="see-all" data-i18n="seeAll">See all ></span>
    </h2>
    <div id="extendedCarousel" class="eyes-carousel"></div>

    <!-- Tools -->
    <h2 class="catalog-h2" data-i18n="toolsTitle">
      Tools and Kits <span class="see-all" data-i18n="seeAll">See all ></span>
    </h2>
    <div id="toolsCarousel" class="eyes-carousel"></div>
  </div>
</div>

<!-- Reusable Coming Soon page -->
<div id="comingSoon" class="page">
  <div class="container">
    <div class="card">
      <h1 id="comingSoonTitle" data-i18n="comingSoonTitle">Coming soon</h1>
      <p class="note" data-i18n="comingSoonNote">
        This module is being prepared.
      </p>
    </div>
  </div>
</div>
