<!-- Eyes Page — Four catalog rows: examination, eye care procedures, conditions, and workshops. -->
<div id="eyesCatalogPage" class="page">
  <div class="container eyes-container">
    <!-- Top bar (title + icons) -->
    <div class="eyes-top">
      <div class="eyes-title" data-i18n="eyesCatalogTitle">Eyes</div>
      <div class="icons">
        <span
          class="icon menuBtn"
          aria-label="Menu"
          data-i18n="i18nExtra.menu_aria_label:aria-label"
          >&#9776;</span
        >
      </div>
    </div>

    <template id="eyesCardTemplate">
      <div class="eyes-card">
        <button type="button" class="eyes-card__open"></button>
        <img class="eyes-card__bg" src="" alt="" />
        <span
          class="heart-btn"
          data-i18n="i18nExtra.eyes_toggle_like:aria-label"
          aria-label="Toggle like"
          title="Like"
          role="button"
          tabindex="0"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 1 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"
            />
          </svg>
        </span>
        <span class="eyes-card__title"></span>
        <div class="tag-row"></div>
      </div>
    </template>

    <!-- Examination -->
    <h2 class="catalog-h2">
      <span data-i18n="examinationTitle">Examination</span>
      <span class="see-all" data-i18n="seeAll">See all ></span>
    </h2>
    <div id="coreCarousel" class="eyes-carousel"></div>
    <div class="eyes-carousel-divider" aria-hidden="true"></div>

    <!-- Eye Care Procedure -->
    <h2 class="catalog-h2">
      <span data-i18n="eyeCareProcedureTitle">Eye Care Procedure</span>
      <span class="see-all" data-i18n="seeAll">See all ></span>
    </h2>
    <div id="procedureCarousel" class="eyes-carousel"></div>
    <div class="eyes-carousel-divider" aria-hidden="true"></div>

    <!-- Conditions -->
    <h2 class="catalog-h2">
      <span data-i18n="diseaseTitle">Conditions</span>
      <span class="see-all" data-i18n="seeAll">See all ></span>
    </h2>
    <div id="diseaseCarousel" class="eyes-carousel"></div>
    <div class="eyes-carousel-divider" aria-hidden="true"></div>

    <!-- Workshops -->
    <h2 class="catalog-h2">
      <span data-i18n="primaryEyeCareProceduresTitle">Workshops</span>
      <span class="see-all" data-i18n="seeAll">See all ></span>
    </h2>
    <div id="pecCarousel" class="eyes-carousel"></div>
  </div>
</div>

<!-- Reusable Coming Soon page -->
<div id="comingSoon" class="page">
  <div class="container">
    <div class="card">
      <h1 id="comingSoonTitle" data-i18n="comingSoonTitle">Coming soon</h1>
      <p class="note" data-i18n="comingSoonNote">
        This module is being prepared.
      </p>
    </div>
  </div>
</div>
