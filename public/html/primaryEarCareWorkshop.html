<div
  id="primaryEarCareWorkshopPage"
  class="page pupils-like has-eyes-topbar pec-workshop-page primary-ear-care-workshop-page"
>
  <div class="container pupils-container">
    <div class="eyes-topbar">
      <div class="eyes-topbar__title" data-i18n="primaryEarCareWorkshop.ears">
        Ears
      </div>
      <div class="eyes-topbar__icons">
        <span class="icon menuBtn" role="button" tabindex="0" aria-label="Menu"
          >&#9776;</span
        >
      </div>
    </div>
    <div class="pupils-levels">
      <section
        class="pupil-level pupil-level--primary"
        aria-label="Primary Ear Care Workshop"
      >
        <div
          class="pupil-level__cap pupil-level__cap--pec-workshop"
          data-i18n="primaryEarCareWorkshop.title"
        >
          Primary Ear Care Workshop
        </div>
        <div class="pec-workshop-folders"></div>
      </section>
    </div>
    <a class="pec-ear-care-link" href="#/pecWorkshop"
      ><span class="pec-ear-care-link__copy"

        ><strong data-i18n="pecWorkshop.title">PEC Workshop</strong></span
      ><i aria-hidden="true">&gt;</i></a

>

    class="container pupils-container diabetic-screening-page medical-students-screening-page"
  >
    <div class="eyes-topbar">
      <div class="eyes-topbar__title" data-i18n="primaryEarCareWorkshop.title">
        Primary Ear Care Workshop
      </div>
      <div class="eyes-topbar__icons">
        <a
          class="core-examination-pdf-download primary-ear-pdf-download"
          hidden

          data-i18n="i18nExtra.download_pdf:aria-label"
        >
          <svg

            width="22"
            height="22"

        <span class="icon menuBtn" role="button" tabindex="0" aria-label="Menu"
          >&#9776;</span
        >

    <main
      class="pec-eye-lesson-content primary-ear-lesson-content"
      aria-live="polite"
    ></main>
  </div>
