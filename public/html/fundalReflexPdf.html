<div id="fundalReflexPdfPage" class="page has-eyes-topbar">
  <div class="container pupils-container">
    <!-- Eyes top bar (do not change existing structure patterns) -->
    <div class="eyes-topbar">
      <div
        class="eyes-topbar__title"
        data-i18n="auto.fundalreflexpdf.fundal_reflex"
      >
        Fundal reflex
      </div>

      <div class="eyes-topbar__icons">
        <!-- Download button (SVG icon) -->
        <a
          id="fundalPdfDownloadBtn"
          href="images/pdf/Workshop/Childhood/FundalPDF.pdf"
          download
          aria-label="Download PDF"
          style="
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            padding: 0;
            cursor: pointer;
          "
          data-i18n="i18nExtra.download_pdf:aria-label"
        >
          <!-- simple download icon -->
          <svg
            viewBox="0 0 24 24"
            width="22"
            height="22"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M12 3a1 1 0 0 1 1 1v9.17l2.59-2.58a1 1 0 1 1 1.41 1.42l-4.3 4.29a1 1 0 0 1-1.4 0l-4.3-4.29a1 1 0 1 1 1.41-1.42L11 13.17V4a1 1 0 0 1 1-1z"
            ></path>
            <path
              d="M5 20a1 1 0 0 1-1-1v-2a1 1 0 1 1 2 0v1h12v-1a1 1 0 1 1 2 0v2a1 1 0 0 1-1 1H5z"
            ></path>
          </svg>
        </a>

        <!-- Keep menu button exactly like other pages -->
        <span
          class="icon menuBtn"
          aria-label="Menu"
          data-i18n="i18nExtra.menu_aria_label:aria-label"
          >☰</span
        >
      </div>
    </div>

    <!-- Fullscreen SVG viewer (below topbar) -->
    <div
      id="fundalPdfViewer"
      aria-label="Fundal reflex PDF viewer"
      data-i18n="auto.fundalreflexpdf.fundal_reflex:aria-label"
    ></div>

    <!-- Below the PDF viewer: extra Fundal images (01~04) -->
    <div style="padding: 14px 0 24px 0">
      <div style="margin: 14px 0">
        <img
          src="/images/pdf/Workshop/Childhood/Fundal/01.jpg"
          alt=""
          loading="lazy"
          style="
            width: 120%;
            height: auto;
            display: block;
            border-radius: 14px;
            margin-left: -24px;
          "
        />
      </div>
      <div style="margin: 14px 0">
        <img
          src="/images/pdf/Workshop/Childhood/Fundal/02.jpg"
          alt=""
          loading="lazy"
          style="
            width: 120%;
            height: auto;
            display: block;
            border-radius: 14px;
            margin-left: -24px;
          "
        />
      </div>
      <div style="margin: 14px 0">
        <img
          src="/images/pdf/Workshop/Childhood/Fundal/03.jpg"
          alt=""
          loading="lazy"
          style="
            width: 120%;
            height: auto;
            display: block;
            border-radius: 14px;
            margin-left: -24px;
          "
        />
      </div>
      <div style="margin: 14px 0">
        <img
          src="/images/pdf/Workshop/Childhood/Fundal/04.jpg"
          alt=""
          loading="lazy"
          style="
            width: 120%;
            height: auto;
            display: block;
            border-radius: 14px;
            margin-left: -24px;
          "
        />
      </div>
    </div>
  </div>
</div>
