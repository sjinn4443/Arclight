<!-- Index Page — Main entry page for the Arclight app. Contains all .page sections and loads scripts/styles. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <title data-i18n="appTitle">Arclight Eyes, Ears, Skin</title>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="favicons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="favicons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="favicons/favicon-16x16.png"
    />
    <link rel="manifest" href="manifest.json" />
    <template id="guestGateModalTemplate">
      <div id="guestGateModal" role="dialog" aria-modal="true">
        <div class="guest-modal">
          <button
            id="guestModalClose"
            class="guest-modal__close"
            aria-label="Close"
          >
            &times;
          </button>
          <h2 class="guest-modal__title">Enjoying Arclight?</h2>
          <p class="guest-modal__text">
            You’ve reached the end of guest access.<br />
            Create a free account to keep exploring all features without limits.
          </p>
          <button id="guestSignupBtn" class="guest-modal__cta btn-primary">
            Create Account
          </button>
        </div>
      </div>
    </template>

    <script>
      if (location.hostname !== "localhost") {
        var s = document.createElement("script");
        s.src =
          "https://browser.sentry-cdn.com/8.26.0/bundle.tracing.replay.min.js";
        s.crossOrigin = "anonymous";
        s.onerror = function () {
          console.warn(
            "Sentry CDN blocked or failed to load; continuing without monitoring.",
          );
        };
        s.onload = function () {
          try {
            Sentry.init({
              dsn: "https://203a0d9e09961e3dc90ebc2337e81642@o4510382478196736.ingest.de.sentry.io/4510382482325584",
              tracesSampleRate: 1.0,
              replaysSessionSampleRate: 0.1,
              replaysOnErrorSampleRate: 1.0,
            });
          } catch (e) {
            console.warn("Sentry init failed:", e);
          }
        };
        document.head.appendChild(s);
      }
    </script>

    <link rel="stylesheet" href="style/base.css" />
    <link rel="stylesheet" href="style/components.css" />
    <link rel="stylesheet" href="style/pages.css" />
    <link rel="stylesheet" href="style/responsive.css" />
    <meta name="theme-color" content="#b4342a" />
  </head>

  <body>
    <!-- Global Top-Left Back Button -->
    <div
      class="nav-icon top-back"
      id="backBtnGlobal"
      aria-label="Back"
      role="button"
      tabindex="0"
      data-i18n="backButton"
    ></div>

    <div id="splashScreenContainer" class="splash-full-screen"></div>

    <div id="page-content">
      <!-- Placeholder for location display -->
      <div
        id="profileLocation"
        class="profile-location"
        style="visibility: hidden"
      >
        Loading location…
      </div>
    </div>

    <div
      id="installPopup"
      style="
        display: none;
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: white;
        border: 1px solid #ccc;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        z-index: 9999;
      "
    >
      <p data-i18n="installPrompt">Install this app for a better experience!</p>
      <button id="installConfirmBtn" data-i18n="installButton">Install</button>
      <button id="installDismissBtn" data-i18n="maybeLaterButton">
        Maybe later
      </button>
    </div>

    <!-- Language Picker Modal (lightweight) -->
    <div id="languagePickerOverlay" class="lang-install__overlay" hidden>
      <div class="lang-install__modal">
        <button class="close-btn" id="closeLangPickerBtn" aria-label="Close">
          &times;
        </button>
        <h3
          class="lang-install__title"
          data-i18n="languageInstall.select_language"
        >
          Select Language
        </h3>

        <!-- Hidden select remains the source of truth / fallback -->
        <div class="lang-install__select-wrap" hidden>
          <select
            id="languagePickerSelect"
            name="language"
            class="lang-install__select"
          >
            <option
              value="en"
              data-native="English"
              selected
              data-i18n="languageInstall.english"
            >
              English
            </option>
            <option
              value="fr"
              data-native="Français"
              data-i18n="languageInstall.french"
            >
              French
            </option>
            <option
              value="ko"
              data-native="한국어"
              data-i18n="languageInstall.korean"
            >
              Korean
            </option>
            <option
              value="pt"
              data-native="Português"
              data-i18n="languageInstall.portuguese"
            >
              Portuguese
            </option>
            <option
              value="es"
              data-native="Español"
              data-i18n="languageInstall.spanish"
            >
              Spanish
            </option>
            <option
              value="sw"
              data-native="Kiswahili"
              data-i18n="languageInstall.swahili"
            >
              Swahili
            </option>
          </select>
        </div>

        <!-- Custom dropdown: collapsed bar + dropdown list -->
        <div class="lang-picker">
          <button
            id="langPickerToggle"
            class="lang-picker__toggle"
            type="button"
            aria-haspopup="listbox"
            aria-expanded="false"
          >
            <span id="langPickerCurrent">English</span>
          </button>

          <ul
            id="languagePickerList"
            class="lang-install__list lang-picker__dropdown"
            role="listbox"
            hidden
          ></ul>
        </div>
      </div>
    </div>

    <script>
      if (location.hostname === "localhost" && "serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          regs.forEach((r) => r.unregister());
        });
      }
    </script>
    <script defer type="module" src="js/main.js"></script>
    <script src="js/quiz-launcher.js"></script>
    <script type="module" src="js/i18n.js"></script>
    <script src="js/language-picker.js" defer></script>
    <script>
      // Script to send IP tracking data
      document.addEventListener("DOMContentLoaded", () => {
        fetch("/track", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          // No body needed for this endpoint as it only tracks the IP
        })
          .then((response) => {
            if (!response.ok) {
              console.error(
                "Failed to send tracking data:",
                response.statusText,
              );
            } else {
              console.log("Tracking data sent successfully.");
            }
          })
          .catch((error) => {
            console.error("Error sending tracking data:", error);
          });
      });
    </script>
  </body>
</html>
