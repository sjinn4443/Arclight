<!-- Index Page — Main entry page for the Arclight app. Contains all .page sections and loads scripts/styles. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <title data-i18n="appTitle">Arclight Eyes, Ears, Skin</title>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="favicons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="favicons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="favicons/favicon-16x16.png"
    />
    <link rel="manifest" href="manifest.json" />
    <template id="guestGateModalTemplate">
      <div id="guestGateModal" role="dialog" aria-modal="true">
        <div class="guest-modal">
          <button
            id="guestModalClose"
            class="guest-modal__close"
            aria-label="Close"
            data-i18n="languageInstall.closeButton:aria-label"
          >
            &times;
          </button>
          <h2 class="guest-modal__title" data-i18n="i18nExtra.guest_gate_title">
            Enjoying Arclight?
          </h2>
          <p
            class="guest-modal__text"
            data-i18n="i18nExtra.guest_gate_text:html"
          >
            You’ve reached the end of guest access.<br />
            Create a free account to keep exploring all features without limits.
          </p>
          <button
            id="guestSignupBtn"
            class="guest-modal__cta btn-primary"
            data-i18n="onboarding.title"
          >
            Create Account
          </button>
        </div>
      </div>
    </template>

    <link rel="stylesheet" href="style/base.css" />
    <link rel="stylesheet" href="style/components.css" />
    <link rel="stylesheet" href="style/pages.css" />
    <link rel="stylesheet" href="style/responsive.css" />
    <meta name="theme-color" content="#b4342a" />
  </head>

  <body>
    <!-- Global Top-Left Back Button -->
    <div
      class="nav-icon top-back"
      id="backBtnGlobal"
      aria-label="Go back"
      role="button"
      tabindex="0"
      data-i18n="i18nLiteral.Go back:aria-label"
    ></div>

    <div id="splashScreenContainer" class="splash-full-screen"></div>

    <div id="page-content">
      <!-- Placeholder for location display -->
      <div
        id="profileLocation"
        class="profile-location"
        style="visibility: hidden"
        data-i18n="i18nExtra.loading_location"
      >
        Loading location…
      </div>
    </div>

    <div
      id="installPopup"
      style="
        display: none;
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: white;
        border: 1px solid #ccc;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        z-index: 9999;
      "
    >
      <p data-i18n="installPrompt">Install this app for a better experience!</p>
      <button id="installConfirmBtn" data-i18n="installButton">Install</button>
      <button id="installDismissBtn" data-i18n="maybeLaterButton">
        Maybe later
      </button>
    </div>

    <!-- Language Picker Modal (lightweight) -->
    <div id="languagePickerOverlay" class="lang-install__overlay" hidden>
      <div class="lang-install__modal">
        <button
          class="close-btn"
          id="closeLangPickerBtn"
          aria-label="Close"
          data-i18n="languageInstall.closeButton:aria-label"
        >
          &times;
        </button>
        <h3 class="lang-install__title" data-i18n="languageInstall.title">
          Select Language
        </h3>

        <!-- Hidden select remains the source of truth / fallback -->
        <div class="lang-install__select-wrap" hidden>
          <select
            id="languagePickerSelect"
            name="language"
            class="lang-install__select"
            aria-label="Language"
          >
            <option
              value="en"
              data-native="English"
              selected
              data-i18n="languageInstall.english"
            >
              English
            </option>
            <option
              value="am"
              data-native="Amharic"
              data-i18n="languageInstall.amharic"
            >
              Amharic
            </option>
            <option
              value="ar"
              data-native="Arabic"
              data-i18n="languageInstall.arabic"
            >
              Arabic
            </option>
            <option
              value="bn"
              data-native="Bangla"
              data-i18n="languageInstall.bangla"
            >
              Bangla
            </option>
            <option
              value="zh"
              data-native="Chinese"
              data-i18n="languageInstall.chinese"
            >
              Chinese
            </option>
            <option
              value="fr"
              data-native="French"
              data-i18n="languageInstall.french"
            >
              French
            </option>
            <option
              value="ha"
              data-native="Hausa"
              data-i18n="languageInstall.hausa"
            >
              Hausa
            </option>
            <option
              value="hi"
              data-native="Hindi"
              data-i18n="languageInstall.hindi"
            >
              Hindi
            </option>
            <option value="ne" data-native="नेपाली">नेपाली</option>
            <option
              value="ny"
              data-native="Chinyanja"
              data-i18n="languageInstall.chichewa"
            >
              Chichewa
            </option>
            <option
              value="ig"
              data-native="Igbo"
              data-i18n="languageInstall.igbo"
            >
              Igbo
            </option>
            <option
              value="id"
              data-native="Indonesian"
              data-i18n="languageInstall.indonesian"
            >
              Indonesian
            </option>
            <option
              value="rw"
              data-native="Kinyarwanda"
              data-i18n="languageInstall.kinyarwanda"
            >
              Kinyarwanda
            </option>
            <option
              value="ko"
              data-native="Korean"
              data-i18n="languageInstall.korean"
            >
              Korean
            </option>
            <option
              value="te"
              data-native="Telugu"
              data-i18n="languageInstall.telugu"
            >
              Telugu
            </option>
            <option
              value="ln"
              data-native="Lingala"
              data-i18n="languageInstall.lingala"
            >
              Lingala
            </option>
            <option
              value="fa"
              data-native="Persian"
              data-i18n="languageInstall.persian"
            >
              Persian
            </option>
            <option
              value="sn"
              data-native="Shona"
              data-i18n="languageInstall.shona"
            >
              Shona
            </option>
            <option
              value="es"
              data-native="Spanish"
              data-i18n="languageInstall.spanish"
            >
              Spanish
            </option>
            <option
              value="sw"
              data-native="Kiswahili"
              data-i18n="languageInstall.swahili"
            >
              Swahili
            </option>
            <option
              value="ur"
              data-native="Urdu"
              data-i18n="languageInstall.urdu"
            >
              Urdu
            </option>
            <option
              value="yo"
              data-native="Yoruba"
              data-i18n="languageInstall.yoruba"
            >
              Yoruba
            </option>
            <option
              value="zu"
              data-native="Zulu"
              data-i18n="languageInstall.zulu"
            >
              Zulu
            </option>
          </select>
        </div>

        <!-- Custom dropdown: collapsed bar + dropdown list -->
        <div class="lang-picker">
          <button
            id="langPickerToggle"
            class="lang-picker__toggle"
            type="button"
            aria-haspopup="listbox"
            aria-expanded="false"
          >
            <span id="langPickerCurrent">English</span>
          </button>

          <ul
            id="languagePickerList"
            class="lang-install__list lang-picker__dropdown"
            role="listbox"
            hidden
          ></ul>
        </div>
      </div>
    </div>

    <script defer src="js/runtime-bootstrap.js"></script>
    <script defer type="module" src="js/safe-console-init.js"></script>
    <script defer type="module" src="js/main.js"></script>
    <script src="js/quiz-launcher.js"></script>
    <script type="module" src="js/i18n.js"></script>
    <script src="js/language-picker.js" defer></script>
  </body>
</html>
