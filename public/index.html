<!-- Index Page — Main entry page for the Arclight app. Contains all .page sections and loads scripts/styles. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title data-i18n="appTitle">Arclight Eyes, Ears, Skin</title>
    <meta
      name="description"
      content="Learn eye, ear and skin examination with Arclight's interactive lessons, clinical videos and offline learning tools."
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="favicons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="favicons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="favicons/favicon-16x16.png"
    />
    <link rel="manifest" href="manifest.json" />
    <template id="guestGateModalTemplate">
      <div id="guestGateModal" role="dialog" aria-modal="true">
        <div class="guest-modal">
          <button
            id="guestModalClose"
            class="guest-modal__close"
            aria-label="Close"
            data-i18n="languageInstall.closeButton:aria-label"
          >
            &times;
          </button>
          <h2 class="guest-modal__title" data-i18n="i18nExtra.guest_gate_title">
            Enjoying Arclight?
          </h2>
          <p
            class="guest-modal__text"
            data-i18n="i18nExtra.guest_gate_text:html"
          >
            You’ve reached the end of guest access.<br />
            Create a free account to keep exploring all features without limits.
          </p>
          <button
            id="guestSignupBtn"
            class="guest-modal__cta btn-primary"
            data-i18n="onboarding.title"
          >
            Create Account
          </button>
        </div>
      </div>
    </template>

    <link rel="stylesheet" href="style/base.css" />
    <link rel="stylesheet" href="style/components.css" />
    <link rel="stylesheet" href="style/reminders.css" />
    <link rel="stylesheet" href="style/pages.css" />
    <link rel="stylesheet" href="style/paediatricWorkshop.css" />
    <link rel="stylesheet" href="style/responsive.css" />
    <link rel="stylesheet" href="style/glaucomaWorkshop.css" />
    <link rel="stylesheet" href="style/frontOfEyePdfTest.css" />
    <link rel="stylesheet" href="style/dashboard-workspace.css" />
    <meta name="theme-color" content="#b4342a" />
  </head>

  <body>
    <!-- Global Top-Left Back Button -->
    <div
      class="nav-icon top-back"
      id="backBtnGlobal"
      aria-label="Go back"
      role="button"
      tabindex="0"
      data-i18n="i18nLiteral.Go back:aria-label"
    ></div>

    <div id="splashScreenContainer" class="splash-full-screen"></div>

    <div id="page-content" role="main">
      <!-- Placeholder for location display -->
      <div
        id="profileLocation"
        class="profile-location"
        style="visibility: hidden"
        data-i18n="i18nExtra.loading_location"
      >
        Loading location…
      </div>
    </div>

    <div
      id="installPopup"
      style="
        display: none;
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: white;
        border: 1px solid #ccc;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        z-index: 9999;
      "
    >
      <p data-i18n="installPrompt">Install this app for a better experience!</p>
      <button id="installConfirmBtn" data-i18n="installButton">Install</button>
      <button id="installDismissBtn" data-i18n="maybeLaterButton">
        Maybe later
      </button>
    </div>

    <!-- Language Picker Modal (lightweight) -->
    <div id="languagePickerOverlay" class="lang-install__overlay" hidden>
      <div class="lang-install__modal">
        <button
          class="close-btn"
          id="closeLangPickerBtn"
          aria-label="Close"
          data-i18n="languageInstall.closeButton:aria-label"
        >
          &times;
        </button>
        <h3 class="lang-install__title" data-i18n="languageInstall.title">
          Select Language
        </h3>

        <!-- Hidden select remains the source of truth / fallback -->
        <div class="lang-install__select-wrap" hidden>
          <select
            id="languagePickerSelect"
            name="language"
            class="lang-install__select"
            aria-label="Language"
            data-i18n="menu.language_item:aria-label"
          >
            <option
              value="en"
              data-native="English"
              lang="en"
              selected
              data-i18n-skip="true"
            >
              English
            </option>
            <option
              value="am"
              data-native="አማርኛ"
              lang="am"
              data-i18n-skip="true"
            >
              አማርኛ
            </option>
            <option
              value="ar"
              data-native="العربية"
              lang="ar"
              data-i18n-skip="true"
            >
              العربية
            </option>
            <option
              value="bn"
              data-native="বাংলা"
              lang="bn"
              data-i18n-skip="true"
            >
              বাংলা
            </option>
            <option
              value="zh"
              data-native="中文"
              lang="zh"
              data-i18n-skip="true"
            >
              中文
            </option>
            <option
              value="fr"
              data-native="Français"
              lang="fr"
              data-i18n-skip="true"
            >
              Français
            </option>
            <option
              value="ha"
              data-native="Hausa"
              lang="ha"
              data-i18n-skip="true"
            >
              Hausa
            </option>
            <option
              value="hi"
              data-native="हिन्दी"
              lang="hi"
              data-i18n-skip="true"
            >
              हिन्दी
            </option>
            <option
              value="ne"
              data-native="नेपाली"
              lang="ne"
              data-i18n-skip="true"
            >
              नेपाली
            </option>
            <option
              value="ny"
              data-native="Chinyanja"
              lang="ny"
              data-i18n-skip="true"
            >
              Chinyanja
            </option>
            <option
              value="ig"
              data-native="Ígbò"
              lang="ig"
              data-i18n-skip="true"
            >
              Ígbò
            </option>
            <option
              value="id"
              data-native="Bahasa Indonesia"
              lang="id"
              data-i18n-skip="true"
            >
              Bahasa Indonesia
            </option>
            <option
              value="rw"
              data-native="Ikinyarwanda"
              lang="rw"
              data-i18n-skip="true"
            >
              Ikinyarwanda
            </option>
            <option
              value="ko"
              data-native="한국어"
              lang="ko"
              data-i18n-skip="true"
            >
              한국어
            </option>
            <option
              value="lo"
              data-native="ລາວ"
              lang="lo"
              data-i18n-skip="true"
            >
              ລາວ
            </option>
            <option
              value="te"
              data-native="తెలుగు"
              lang="te"
              data-i18n-skip="true"
            >
              తెలుగు
            </option>
            <option
              value="lg"
              data-native="Luganda"
              lang="lg"
              data-i18n-skip="true"
            >
              Luganda
            </option>
            <option
              value="ln"
              data-native="Lingála"
              lang="ln"
              data-i18n-skip="true"
            >
              Lingála
            </option>
            <option
              value="fa"
              data-native="فارسی"
              lang="fa"
              data-i18n-skip="true"
            >
              فارسی
            </option>
            <option
              value="pt"
              data-native="Português"
              lang="pt"
              data-i18n-skip="true"
            >
              Português
            </option>
            <option
              value="sn"
              data-native="ChiShona"
              lang="sn"
              data-i18n-skip="true"
            >
              ChiShona
            </option>
            <option
              value="es"
              data-native="Español"
              lang="es"
              data-i18n-skip="true"
            >
              Español
            </option>
            <option
              value="sw"
              data-native="Kiswahili"
              lang="sw"
              data-i18n-skip="true"
            >
              Kiswahili
            </option>
            <option
              value="ur"
              data-native="اردو"
              lang="ur"
              data-i18n-skip="true"
            >
              اردو
            </option>
            <option
              value="yo"
              data-native="Yorùbá"
              lang="yo"
              data-i18n-skip="true"
            >
              Yorùbá
            </option>
            <option
              value="zu"
              data-native="isiZulu"
              lang="zu"
              data-i18n-skip="true"
            >
              isiZulu
            </option>
          </select>
        </div>

        <!-- Custom dropdown: collapsed bar + dropdown list -->
        <div class="lang-picker">
          <button
            id="langPickerToggle"
            class="lang-picker__toggle"
            type="button"
            aria-haspopup="listbox"
            aria-expanded="false"
          >
            <span id="langPickerCurrent" data-i18n-skip="true">English</span>
          </button>

          <ul
            id="languagePickerList"
            class="lang-install__list lang-picker__dropdown"
            data-i18n-skip="true"
            role="listbox"
            hidden
          ></ul>
        </div>
      </div>
    </div>

    <script defer src="js/runtime-bootstrap.js"></script>
    <script defer type="module" src="js/safe-console-init.js"></script>
    <script defer type="module" src="js/main.js"></script>
    <script src="js/quiz-launcher.js"></script>
    <script type="module" src="js/i18n.js"></script>
    <script src="js/language-picker.js" defer></script>
  </body>
</html>
