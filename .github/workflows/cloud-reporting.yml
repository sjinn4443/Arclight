name: Cloud reporting service

on:
  pull_request:
    paths:
      - "cloud-reporting/**"
      - ".github/workflows/cloud-reporting.yml"
  push:
    branches: [main]
    paths:
      - "cloud-reporting/**"
      - ".github/workflows/cloud-reporting.yml"

permissions:
  contents: read

concurrency:
  group: cloud-reporting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-reporting
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud-reporting/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests
      - run: pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: cloud-reporting
          push: false
          tags: arclight-cloud-reporting:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
