name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Check formatting
        run: npm run format:check

      - name: Run build
        run: npm run build

      - name: Format dist folder
        run: npm run format:dist

      - name: Lint dist folder
        run: npm run lint:dist # Changed from 'npm run lint' to 'npm run lint:dist'

      - name: Security audit
        run: npm audit --audit-level=moderate

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.13.x
          nohup http-server dist &
          sleep 5 # give server a moment to start
          lhci collect --url=http://localhost:8080
          lhci upload
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Run translation checks
        run: npm run check-translations

      - name: Run accessibility tests
        run: npm run test:a11y

      - name: Run Jest tests
        run: npm run test:ci
        env:
          MASTER_PASSWORD_HASH: ${{ secrets.TEST_MASTER_PASSWORD_HASH }}
          PASSWORD_SALT: ${{ secrets.TEST_PASSWORD_SALT }}
          ONE_TIME_PASSWORD_HASHES: ${{ secrets.TEST_ONE_TIME_PASSWORD_HASHES }}

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
