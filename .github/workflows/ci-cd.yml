name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Pull Git LFS files
        run: |
          git lfs install
          git lfs pull
          git lfs checkout

      - name: Debug video sizes
        shell: bash
        run: |
          # This step is only for debugging/visibility in CI.
          # Some branches/environments may not include these large assets,
          # so this must NOT fail the pipeline.
          set -euo pipefail

          if [[ -d "public/videos/Pupil" ]]; then
            shopt -s nullglob
            files=(public/videos/Pupil/*.mp4)
            if (( ${#files[@]} )); then
              ls -lh "${files[@]}"
            else
              echo "No .mp4 files found under public/videos/Pupil/"
            fi
          else
            echo "Directory public/videos/Pupil/ does not exist in this checkout."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Check formatting
        run: npm run format:check

      - name: Run build
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run accessibility tests
        run: npm run test:a11y

      - name: Run Jest tests
        run: npm run test:ci
        env:
          MASTER_KEY: ${{ secrets.MASTER_KEY }}

      - name: Run fundal E2E validation
        run: npm run test:fundal:ci

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
