name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DASHBOARD_PASSWORD: ci-quality-dashboard-password-2026
      TELEMETRY_TOKEN_SECRET: ci-quality-telemetry-secret-2026-value

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 0

      - name: Pull Git LFS files
        run: |
          git lfs install
          git lfs pull
          git lfs checkout

      - name: Debug video sizes
        shell: bash
        run: |
          # This step is only for debugging/visibility in CI.
          # Some branches/environments may not include these large assets,
          # so this must NOT fail the pipeline.
          set -euo pipefail

          if [[ -d "public/videos/Pupil" ]]; then
            shopt -s nullglob
            files=(public/videos/Pupil/*.mp4)
            if (( ${#files[@]} )); then
              ls -lh "${files[@]}"
            else
              echo "No .mp4 files found under public/videos/Pupil/"
            fi
          else
            echo "Directory public/videos/Pupil/ does not exist in this checkout."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium webkit

      - name: Install Playwright browsers
        run: npx playwright install chromium webkit

      - name: Check formatting
        run: npm run format:check

      - name: Run build
        run: npm run build

      - name: Check types and clinical safety assertions
        run: |
          npm run type-check
          npm run check:clinical

      - name: Security audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verify non-root production container
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag arclight-security-check .
          test "$(docker run --rm --entrypoint id arclight-security-check -u)" != "0"

          container_name="arclight-runtime-check"
          trap 'docker rm --force "$container_name" >/dev/null 2>&1 || true' EXIT
          docker run --detach \
            --name "$container_name" \
            --publish 127.0.0.1:8080:8080 \
            --env DASHBOARD_PASSWORD=ci-runtime-dashboard-password-2026 \
            --env TELEMETRY_TOKEN_SECRET=ci-runtime-telemetry-secret-2026-value \
            arclight-security-check

          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8080/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs "$container_name"
          exit 1

      - name: Run accessibility tests
        run: npm run test:a11y

      - name: Run Jest tests
        run: npm run test:ci

      - name: Run fundal E2E validation
        run: npm run test:fundal:ci
        env:
          DASHBOARD_PASSWORD: ci-fundal-dashboard-password-2026
          TELEMETRY_TOKEN_SECRET: ci-fundal-telemetry-secret-2026-value

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

      - name: Responsive Chromium and WebKit matrix, accessibility and offline playback
        run: npm run test:quality

      - name: Upload responsive and offline evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quality-browser-matrix
          path: |
            playwright-report/
            test-results/

      - name: Changed examination animation journeys
        run: npm run test:animations

      - name: Upload examination animation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: examination-animation-report
          path: |
            playwright-report/
            test-results/

      - name: Lighthouse quality gates
        run: npm run test:lighthouse

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quality-reports
          path: |
            quality-reports/
            dist-size-report.json

      - name: Require bilingual clinical release approval
        run: npm run check:clinical-approval

      - name: Upload production artifact
        uses: actions/upload-artifact@v6
        with:
          name: app-shell
          path: dist/

      - name: Upload optional content packs
        uses: actions/upload-artifact@v6
        with:
          name: media-packs
          path: dist-media/
          compression-level: 0

      - name: Upload source maps separately
        uses: actions/upload-artifact@v6
        with:
          name: source-maps
          path: dist-sourcemaps/
